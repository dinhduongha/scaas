[package]
name = "scaas-pqz-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
license-file = "../LICENSE"
description = "The reference PQZ verifier (off-chain): verifies public PQZ proofs and signs PqzVerdict (UNAUDITED)"

# Its own crate and binary (3f spec §11.2, C7): never linked into scaas-node, never depending on it. pqz-ffi with its
# default features: the Rust PQZL backend at n2304-kmax4096; `pqz_ffi::precompile` is byte for byte the precompile's verdict;
# pqz-offchain adds the split id of opening tokens (K3-4) over the same verifiers (`offchain`).
[dependencies]
alloy = { version = "~1.6", default-features = false, features = [
  "std",
  "provider-http",
  "rpc-types",
  "signer-local",
  "signer-keystore",
  "sol-types",
  "network",
  "reqwest",
  "json-rpc",
] }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
pqz-ffi = { path = "../pqz-core/ffi" }
# the network crate (CLI-RPC-12): the endpoint list and the bounded transport; per-index providers (node-internal, F10)
scaas-rpc = { path = "../clients/scaas-rpc", default-features = false, features = ["evm", "node-internal"] }
pqz-offchain = { path = "../pqz-core/ffi/offchain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# tests/anvil.rs: anvil_dumpState is gzipped, --load-state reads its JSON (the strict-majority case, plan T9)
flate2 = "1"
tower = { version = "0.5", features = ["util"] }
# the paused clock of the slow-body test (Fable C-4)
tokio = { version = "1", features = ["full", "test-util"] }
# tests/anvil.rs (opt-in): the PQ signer of the holders, Falcon-512 verified in Solidity on anvil (the node e2e's pins)
pqcrypto-falcon = { version = "=0.4.1", default-features = false }
pqcrypto-traits = { version = "=0.3.5", default-features = false }

# the PQZL verifier is slow unoptimised; the tests verify real proofs
[profile.dev.package.pqzl]
opt-level = 3
[profile.dev.package.pqz-stmt]
opt-level = 3
[profile.dev.package.pqz-ffi]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
