# R52 (GA 2.1#4): contracts and the relay node. Mirrors the local commands:
#   smartcontracts/evm: forge test; FOUNDRY_PROFILE=private7622 forge build;
#                  forge build src --sizes --json > /tmp/sizes.json; python3 ../../scripts/size_gate.py /tmp/sizes.json size-baseline.json
#   scaas-node:    cargo test; cargo clippy --all-targets -- -D warnings; cargo test --test e2e -- --ignored
#   docs:          python3 scripts/test_docs_check.py; python3 scripts/docs_check.py check; ... facts check
#   clients/clientkeys:    npm ci --ignore-scripts; npm test
#   clients/zether-prover: cargo test; ./wasm-smoke.sh (wasm32 build + wasm-bindgen + node smoke)
#   clients/scaas-ua:      cargo test; cargo clippy --all-targets -- -D warnings
#   clients/ua-py:         python3 -m unittest tests.test_vectors
#   clients/ua-go:         go vet ./...; go test ./...
#   clients/ua-cs:         dotnet test Scaas.Ua.Tests
name: scaas-ci

on:
  pull_request:
    paths: ['smartcontracts/**', 'scaas-node/**', 'clients/**', 'docs/**', 'scripts/docs_check.py', 'scripts/test_docs_check.py', 'scripts/size_gate.py', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['smartcontracts/**', 'scaas-node/**', 'clients/**', 'docs/**', 'scripts/docs_check.py', 'scripts/test_docs_check.py', 'scripts/size_gate.py', '.github/workflows/ci.yml']

env:
  OZ_TAG: v5.2.0
  FORGE_STD_TAG: v1.16.2

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartcontracts/evm
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # lib/ is not committed: install the pinned tags (no submodule bookkeeping).
      - name: Libraries at pinned tags
        run: |
          forge install --no-git foundry-rs/forge-std@${FORGE_STD_TAG}
          forge install --no-git OpenZeppelin/openzeppelin-contracts@${OZ_TAG}
      - name: forge test (default profile)
        run: forge test
      - name: size gate (CTR-TOK-24, ratchet)
        run: |
          python3 ../../scripts/size_gate.py --self-test
          forge build src --sizes --json > /tmp/sizes.json || true
          python3 ../../scripts/size_gate.py /tmp/sizes.json size-baseline.json
      - name: forge build (private7622 profile)
        run: FOUNDRY_PROFILE=private7622 forge build

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaas-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scaas-node
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Contract libraries for the e2e deploy script
        working-directory: smartcontracts/evm
        run: |
          forge install --no-git foundry-rs/forge-std@${FORGE_STD_TAG}
          forge install --no-git OpenZeppelin/openzeppelin-contracts@${OZ_TAG}
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit + proptest
        run: cargo test
      - name: e2e on anvil
        run: cargo test --test e2e -- --ignored --test-threads=1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checker self-test
        run: python3 scripts/test_docs_check.py
      - name: register, links, lint, diagrams (C1-C11)
        run: python3 scripts/docs_check.py check
      - name: fact ledger
        run: python3 scripts/docs_check.py facts check

  clientkeys:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/clientkeys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install (no lifecycle scripts)
        run: npm ci --ignore-scripts
      # The vendored-bundle tests skip here: the bundle lives in the client repo that embeds scaas.
      - name: unit tests and vectors
        run: npm test

  zether-prover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/zether-prover
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/zether-prover
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: unit tests and vectors
        run: cargo test
      - name: wasm build and node smoke
        run: WASM_BINDGEN=wasm-bindgen ./wasm-smoke.sh

  scaas-ua:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/scaas-ua
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-ua
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: vectors
        run: cargo test

  scaas-ua-cxx:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/scaas-ua-cxx
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-ua-cxx
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCAAS_UA_CARGO_TARGET_DIR=$PWD/target
      - name: build
        run: cmake --build build
      - name: vectors
        run: ctest --test-dir build --output-on-failure

  ua-qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev
      - name: Build
        working-directory: clients/scaas-ua-qt
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake6"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
      - name: Test
        working-directory: clients/scaas-ua-qt/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

  ua-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install -r requirements.txt
      - name: vectors
        run: python -m unittest -v tests.test_vectors

  ua-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: clients/ua-go/go.sum
      - name: vet
        run: go vet ./...
      - name: vectors
        run: go test ./...

  ua-cs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-cs/Scaas.Ua.Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: vectors
        run: dotnet test

  scaas-ua-frb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/scaas-ua-frb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-ua-frb/rust
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: cargo build --manifest-path rust/Cargo.toml
      - run: dart test
      # optional drift guard: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      #   && flutter_rust_bridge_codegen generate && git diff --exit-code

  ua-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dart pub get
        working-directory: clients/ua-dart
      - run: dart analyze
        working-directory: clients/ua-dart
      - run: dart test
        working-directory: clients/ua-dart
      - run: dart test -p node
        working-directory: clients/ua-dart
