# R52 (GA 2.1#4): contracts and the relay node. Each job runs only when a path it reads changed (.github/ci_changes.py).
# Mirrors the local commands:
#   contract-evm:  per PQZ set (matrix n2048-kmax1024, n2304-kmax4096, n2560-kmax16384, n2816-kmax65536): script/pqz/at-set.sh <set> test;
#                  once, in the n2304-kmax4096 cell (the committed set, so its at-set run is the default-set `forge test`):
#                  python3 -I ../../pqz-core/params/sets/gen_set.py --all --check (PqzSet.sol and every generated file equal set.toml's);
#                  forge test --isolate --match-path 'test/ua/{UAGas,UARegistryGroups}.t.sol' (cold gas); FOUNDRY_PROFILE=scaas-testnet forge build;
#                  python3 script/test_*.py; forge build src/pqchat/PqChatStore.sol test/forkcheck --extra-output evm.legacyAssembly --out "$T"/out;
#                  script/forkcheck.py exec cancun test/forkcheck/cases.json, forkcheck.py control cancun, deploy_pqchatstore.py local (--out "$T"/out);
#                  T=$(mktemp -d); forge build src --sizes --json > "$T"/sizes.json; python3 ../../scripts/size_gate.py "$T"/sizes.json size-baseline.json
#   contract-<family>: smartcontracts/scripts/test.sh <family> (unit and in-process tests; localnet e2e stays local), toolchains as local:
#   contract-soroban:  test.sh soroban (cargo test)
#   contract-solana:   test.sh solana (build.sh solana = cargo build-sbf, Agave 4.3.0 / platform-tools v1.57; cargo test on LiteSVM)
#   contract-near:     test.sh near (check_no_authority.sh, cargo near build, cargo test: unit + near-sandbox; cargo-near 0.22.0)
#   contract-algorand: ALGORAND_ARTIFACTS_CHECK=1 smartcontracts/scripts/build.sh algorand; gen_vectors.py --check; scripts/test_deploy.py
#                      (test.sh algorand without its last step: pytest on the localnet and the node e2e of both are local only, the gate runner)
#   contract-aptos:    test.sh aptos (aptos move test --dev; check_entry_visibility.sh; aptos CLI 9.6.0)
#   contract-sui:      test.sh sui (sui move test; sui CLI 1.81.0, testnet-v1.81.0)
#   contract-cosmos:   test.sh cosmos (cargo test)
#   contract-ton:      test.sh ton (npm ci; npm test = tact build + jest; Node 26.8.1)
#   scaas-node:    cargo test; cargo clippy --all-targets -- -D warnings; cargo test --test e2e -- --ignored
#   clients/scaas-rpc: cargo test --locked --all-features; cargo clippy --locked --all-targets --all-features -- -D warnings;
#                  cargo test --locked --features evm --test anvil -- --ignored (three anvils, foundry's);
#                  cargo check --locked --target wasm32-unknown-unknown --no-default-features --features evm,node-client (compiles for
#                  wasm32, not run); ! git grep -n 'tokio::time' -- src (no tokio timer in the crate, F18)
#   pqz:           in pqz-core: params/sets/gen_set.py --all --check, pqzl/params/to_rust.py --check (generated files in sync);
#                  sh gate-controls.sh (the gate scripts' negative controls, stubs only);
#                  python3 -I nethermind/chain/check-provisional-ids.py (each provisional schedule's ids = PqzSetIds.cs);
#                  at PQZ_SET n2304-kmax4096: pqzl/build.sh native, kat/check.py (KAT); pqzl/check_tbox_fixes.sh, sv/check_sv_fixes.sh;
#                  ffi pqz-vectors --check, smartcontracts/vectors/pqz/pqz_kat.py --check, ffi/vectors/tamper.py; cargo test --release (stmt, pqzh/ligero, ffi);
#                  fuzz smoke (fuzz/run.sh precompile, mutate, codec: 60 s each on the committed corpora)
#   docs:          python3 scripts/test_docs_check.py; python3 scripts/docs_check.py check; ... facts check; ... paths; ... consumer;
#                  ! git grep -nE '/[t]mp/' -- . ':!*/legacy/*' ':!docs/history/*' (no temp path, AGENTS.md Security)
#                  python3 -I smartcontracts/evm/script/pqz/gas-inputs.py --check (the PQZ gas table's inputs = the calibrated or
#                  provisional precompile rows and each set's proofs; T21 L67)
#   format:        scripts/format.sh --check (check only, at the pinned versions: rustfmt of rust-toolchain.toml, forge 1.8.5, clientkeys'
#                  Prettier 3.3.3, ruff 0.16.4, gofmt, dotnet format whitespace, dart format, clang-format 19.1.7, movefmt 1.5.3 (Aptos Move),
#                  tact-fmt (Tact 1.6.13), shfmt 3.10.0, taplo 0.9.3,
#                  actionlint 1.7.12, hadolint 2.15.1 on errors; .rustfmt-ignore, .clang-format-ignore and foundry.toml [fmt] keep
#                  generated and harness-read files out)
#   clients/clientkeys:    npm ci --ignore-scripts; npm test; its ML-DSA-65 signer (script/pqz/mldsa.mjs) against the DEX:
#                          MLDSA_CLIENTKEYS=../../clients/clientkeys forge test --ffi --match-path test/liquidity/DexLiquidityMldsa.t.sol
#   clients/zether-prover: cargo clippy --all-targets -- -D warnings, default and --features hazmat; cargo test; cargo test --features hazmat (ARCH-POS-13: the raw commands, test-only); ./wasm-smoke.sh (wasm32 build + wasm-bindgen + node smoke: the shipped wasm refuses the raw commands) and ZETHER_HAZMAT=1 ./wasm-smoke.sh (the prover in wasm); zether-cli --features hazmat against the tokens (ZetherProverCross);
#                          cargo test --test read_balance --bin zether-read-balance -- --include-ignored, default and hazmat (the reading layer against anvil, ANVIL = foundry's)
#   clients/ua-rs:         one matrix cell per feature set (ua-rs-sign MD-5, T18), each: cargo clippy --locked --all-targets <features> -- -D warnings; cargo test --locked <features> [<tests>]:
#                          default (wallet + zether + pqz at n2304-kmax4096, the release cell; no_oracle, pqz_wallet_rows; then pqz_read --bin pqz-read -- --include-ignored against anvil),
#                          vectors (--features vectors: the test hooks, the vector rows both ways, no_oracle's positive control), verify-only (--no-default-features),
#                          core (plan T42: wallet with no fam-*: --lib core_only wallet_pairing bls_multi wallet_webauthn bip85 wallet_pq),
#                          signers (--test groups_verify; tests/groups.rs, the generator, runs in the vectors cell), json (--test json), pq (--test pq --test ua_portable), wallet-mlock (wallet,mlock), zether-only (wallet,zether,mlock: --lib --test facade_zether),
#                          pqz-n2048 (wallet,zether,pqz,pqz-set-n2048-kmax1024,mlock: --lib --bin pqz-read --test pqz_read facade_pqz_state facade_pqz pqz_backup no_oracle) and the same + vectors
#                          (facade_pqz_state facade_pqz pqz_backup no_oracle), pqvault (--test pqvault_pass: the Argon2id reproducer of vectors/pqvault/pass.json); the vectors cell also: cargo test --features vectors --test pqz_wallet_rows -- --ignored --exact write_wallet_rows; git diff --exit-code (wallet_state.json stays what its generator writes)
#   ua-rs-features:        plan T42: in clients/ua-rs, bash runs/fam-sizes.sh: cargo build --locked --release --example fam_size with no family, each
#                          fam-<row> alone and all on (wallet always), each probe's size printed
#   ua-rs-targets:         compile only, no run (MD-5, plan T0 / T18), wasm32-unknown-unknown, aarch64-linux-android (NDK clang, API 24), aarch64-apple-ios (macOS): cargo build --locked --lib --target <t> <cell> in ua-rs
#                          for the default, --no-default-features, signers, json, pq, wallet, zether, pqz at n2048-kmax1024; then cargo build --locked --lib --target <t> in ua-c
#   ua-deps:               cargo tree --locked -e normal for ua-rs, ua-c, ua-cxx, ua-qt, ua-dart-frb/rust, ua-rs/fuzz, zether-prover, scaas-node (no lockfile moves);
#                          cargo deny --all-features check in ua-rs; cargo deny --all-features --config <ua-rs>/deny.toml check in ua-c, ua-cxx, ua-qt,
#                          ua-dart-frb/rust and zether-prover (cargo-deny 0.20.2; T21 L68: the three binding locks too);
#                          cargo audit --ignore <each ignore of ua-rs/deny.toml> in the same six (cargo-audit 0.22.2)
#   clients/ua-py:         (cd clients/ua-c && cargo build --release --locked); python3 -m unittest tests.test_vectors tests.test_wallet (the wallet over libscaas_ua_c, no_oracle included)
#   clients/ua-go:         (cd clients/ua-c && cargo build --release --locked); go vet ./...; LD_LIBRARY_PATH=../ua-c/target/release go test -count=1 ./... (wallet/ links clients/ua-c/target/release, no rpath)
#   clients/ua-cs:         (cd clients/ua-c && cargo build --release --locked); dotnet test Scaas.Ua.Tests
#   clients/ua-cxx:        cargo clippy --locked --all-targets -- -D warnings; cmake -S . -B build -G Ninja && cmake --build build && ctest --test-dir build
#   clients/ua-c:          cargo clippy --locked --all-targets -- -D warnings; cargo build --locked; cargo test --locked (header drift); cc ... tests/smoke.c (C99 smoke); python3 -m unittest -v tests.test_vectors;
#                          tests/asan-smoke.sh (smoke.c and the staticlib under AddressSanitizer: RUSTC_BOOTSTRAP=1 for -Zsanitizer, test build in target/asan only, owner 2026-11-06)
#   clients/ua-qt:         cmake -S . -B build -G Ninja (QMAKE, CMAKE_PREFIX_PATH set) && cmake --build build && QT_QPA_PLATFORM=offscreen ctest
#   clients/scaas-ct:      cargo clippy --locked --all-targets --features vectors -- -D warnings; cargo test --locked; cargo test --locked --features vectors
#                          (secret_mul's own tests: ua-rs and zether-prover only build the crate; ua-rs-sign T15o)
#   clients/ua-dart-frb:   dart pub get --enforce-lockfile; cargo build --locked --manifest-path rust/Cargo.toml; cargo test --locked --manifest-path rust/Cargo.toml
#                          (the binding's own Rust tests: secrets never cross frb's codec; T15o); dart test
#   clients/ua-dart:       dart analyze; dart test; dart test -p node; dart run test/vectors_test.dart (asserts off)
#   scaas-sdk:             in clients/scaas-sdk: cargo test --locked --features vault,account,wallet,zether,pqz,pqz-set-n2304-kmax4096,dex,admin,classical-roots,app-core,pqchat-records,near,algorand,cosmos,aptos,solana,soroban,sui,ton;
#                          cargo test --locked --no-default-features --features vault,file-store; without evm (T41.evm step 0) cargo test and cargo clippy --all-targets
#                          -- -D warnings --no-default-features --features vault,account,wallet,file-store,mlock,near,algorand,cosmos,aptos,solana,soroban,sui,ton,native-networks,raw-native;
#                          cargo test --locked --lib --features <the same>,native-networks,raw-native;
#                          cargo test --locked --features <the same>,vectors --test pqchat_keys --test app_core_vault_rows (the test feature alone: a vectors build refuses
#                          scaas-ua key handles until a test unlocks them); cargo clippy --locked --all-targets --features <the same>,vectors,native-networks,raw-native -- -D warnings; per PQZ set
#                          (n2048-kmax1024, n2560-kmax16384, n2816-kmax65536): cargo test --locked --no-default-features --features vault,account,wallet,pqz,pqz-set-<set> --test sets;
#                          cargo test --locked --test feature_tree (the e2e on anvil, 6 GB, stays the local gate sdk-e2e)
#   scaas-sdk-wasm:        in clients/scaas-sdk: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features vault,account,wallet,evm
#   scaas-sdk-bindings:    SCAAS_GEN=dart clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check (flutter_rust_bridge_codegen 2.13.0 with cargo-expand 1.0.127: the
#                          generated FRB Dart surface of the whole SDK equals the committed one); in clients/scaas-sdk/ffi: cargo clippy --locked --all-targets
#                          -- -D warnings; cargo build --locked; in clients/scaas-sdk/bindings/dart: dart pub get --enforce-lockfile; dart test (the load check,
#                          the vault and keystore rows, the e2e smoke on a local anvil: foundry v1.8.5)
#   scaas-sdk-cpp:         uniffi-bindgen-cpp v0.10.0+v0.31.0 (cargo install --git --tag --locked); bash clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh
#                          --check (its C++ part: the generated sync surface equals the committed one; FRB skipped by SCAAS_GEN=cpp); in
#                          clients/scaas-sdk/ffi: cargo clippy --locked --all-targets --features sync-api -- -D warnings; in clients/scaas-sdk:
#                          cargo test --locked --features <the scaas-sdk set>,sync-api --test binding; in clients/scaas-sdk/bindings/cpp:
#                          cmake -B build && cmake --build build && ctest --test-dir build (the keystore and vault rows, a C++ store and
#                          authenticator, a panic as Internal, a C++ exception as the SDK's error, a cancel token)
#   scaas-sdk-cs:          uniffi-bindgen-cs v0.11.1+v0.31.0 (cargo install --git --tag --locked); SCAAS_GEN=cs
#                          clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check (the generated C# over the async API equals
#                          the committed one; it builds the reference library with `uniffi`); in clients/scaas-sdk/bindings/cs:
#                          dotnet test (the keystore and vault rows, a C# async store and authenticator, the PRF by the copy call,
#                          a panic as Internal, C# exceptions as the SDK's errors)
#   scaas-sdk-python:      uniffi 0.31.0 (cargo install uniffi --version =0.31.0 --features cli --locked: uniffi-bindgen);
#                          SCAAS_GEN=python clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check (the generated Python over
#                          the async API equals the committed one; it builds the reference library with `uniffi`); in
#                          clients/scaas-sdk/bindings/python: python3 -I test_smoke.py (the keystore and vault rows, a Python
#                          async store and authenticator, the PRF by the copy call, a panic as Internal, Python exceptions)
#   scaas-sdk-kotlin:      uniffi 0.31.0 (as scaas-sdk-python); SCAAS_GEN=kotlin clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh
#                          --check; JDK 17, kotlinc 2.4.21 (the compiler zip of its GitHub release, KOTLINC); in
#                          clients/scaas-sdk/bindings/kotlin: bash run.sh (JNA 5.17.0 and kotlinx-coroutines-core-jvm 1.10.2 from
#                          Maven Central by sha256; the keystore and vault rows, a Kotlin async store and authenticator, the PRF
#                          by the copy call, a panic as Internal, Kotlin exceptions as the SDK's errors)
#   scaas-sdk-swift:       uniffi 0.31.0 (as scaas-sdk-python); SCAAS_GEN=swift clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh
#                          --check; Swift 6.4.2 (swift.org's Ubuntu 24.04 tarball, SWIFTC); in clients/scaas-sdk/bindings/swift:
#                          bash run.sh (the keystore and vault rows, a Swift async store and authenticator, the PRF by the copy
#                          call, a panic as Internal, Swift errors as the SDK's errors)
#   scaas-sdk-js:          wasm-bindgen-cli 0.2.130 (cargo install --version =0.2.130 --locked, the crate's pin); in
#                          clients/scaas-sdk: cargo clippy --target wasm32-unknown-unknown --no-default-features --features
#                          <the set>,wasm -- -D warnings; in clients/scaas-sdk/bindings/js: bash run.sh (the cdylib for wasm32,
#                          wasm-bindgen for Node, node --test: the keystore and vault rows, a JS store and authenticator, the PRF
#                          by the copy call, the caller's array zeroed, a released handle refused)
#   scaas-sdk-java:        uniffi-bindgen-java 0.4.2 (cargo install --version =0.4.2 --locked); SCAAS_GEN=java
#                          clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check (with bindings/java/fix_generated.py);
#                          JDK 25 (Java's FFM API); in clients/scaas-sdk/bindings/java: python3 -I test_fix_generated.py, bash
#                          run.sh (the keystore and vault rows, a Java async store and authenticator, the PRF by the copy call, a
#                          panic as Internal, Java exceptions as the SDK's errors)
#   scaas-sdk-go:          uniffi-bindgen-go v0.7.1+v0.31.0 (cargo install --git --tag --locked); SCAAS_GEN=go
#                          clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check; Go 1.22; in clients/scaas-sdk/bindings/go:
#                          bash run.sh (go vet, go test ./smoke with cgo over the reference library: the keystore and vault rows, a
#                          Go store and authenticator, the PRF by the copy call, a panic as Internal, Go errors as the SDK's)
#   scaas-cli:             in clients/scaas-cli: cargo test --locked; cargo test --locked --features dev-profiles (the review and the quote
#                          before a submit, against the SDK tests' fake chain); cargo clippy --locked --all-targets --features dev-profiles -- -D warnings
#   keystore-vectors:      smartcontracts/vectors/keystore/ read by both sides: in clients/clientkeys npm ci --ignore-scripts;
#                          node --test test/keystore.test.js test/keystore-index.test.js test/vault.test.js; in clients/scaas-sdk cargo test --locked --test keystore_vectors
#   test-features:         python3 scripts/check_test_features.py (ARCH-POS-13: no `vectors` / `hazmat` of scaas-ua, zether-prover, pqz-ffi
#                          in a production manifest or in the cargo tree -e features graph of ua-c, ua-cxx, ua-qt, ua-dart-frb, zether-prover)
#   UA-8 portable registrations: smartcontracts/vectors/ua/portable.json is read by ua-rs, ua-py, ua-go, ua-cs, ua-c, ua-cxx, ua-qt, ua-dart, ua-dart-frb,
#                  clientkeys and forge (UARegistryUaPortable.t.sol); the jobs above already run them, so no new job. The old chain-bound vectors are in
#                  smartcontracts/vectors/ua/legacy/. The local closing gate: smartcontracts/evm/runs/2026-10-30-ua8-gates.sh (its logs are runs/2026-10-30-ua8-*.txt)
# Rust: one toolchain for every job (ARCH-POS-12): env RUST_TOOLCHAIN (default 1.97.1 = the root rust-toolchain.toml; a manual
#   run may set input rust_toolchain), installed by every dtolnay/rust-toolchain step and exported as RUSTUP_TOOLCHAIN.
# Force a group on whatever the paths: (1) a pull-request label ci-full-contracts | ci-full-node | ci-full-clients | ci-full-pqz | ci-full;
#   (2) Actions tab > scaas-ci > Run workflow, or `gh workflow run ci.yml -f full=ci-full-node --ref <branch>` (runs that group and docs only).
name: scaas-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled] # labeled: a ci-full-* label reruns with that group on
    paths:
      [
        "smartcontracts/**",
        "scaas-node/**",
        "clients/**",
        "docs/**",
        "scripts/docs_check.py",
        "scripts/test_docs_check.py",
        "scripts/size_gate.py",
        "scripts/check_test_features.py",
        "pqz-core/**",
        "rust-toolchain.toml",
        ".github/workflows/ci.yml",
        ".github/ci_changes.py",
        "scripts/format.sh",
        "rustfmt.toml",
        ".rustfmt-ignore",
        ".prettierrc",
        ".prettierignore",
        "pyproject.toml",
        ".editorconfig",
        ".clang-format",
        ".clang-format-ignore",
        "taplo.toml",
      ]
  push:
    branches: [main]
    paths:
      [
        "smartcontracts/**",
        "scaas-node/**",
        "clients/**",
        "docs/**",
        "scripts/docs_check.py",
        "scripts/test_docs_check.py",
        "scripts/size_gate.py",
        "scripts/check_test_features.py",
        "pqz-core/**",
        "rust-toolchain.toml",
        ".github/workflows/ci.yml",
        ".github/ci_changes.py",
        "scripts/format.sh",
        "rustfmt.toml",
        ".rustfmt-ignore",
        ".prettierrc",
        ".prettierignore",
        "pyproject.toml",
        ".editorconfig",
        ".clang-format",
        ".clang-format-ignore",
        "taplo.toml",
      ]
  workflow_dispatch:
    inputs:
      full:
        description: the group to run whatever the paths (docs runs too)
        type: choice
        options: [ci-full, ci-full-contracts, ci-full-node, ci-full-clients, ci-full-pqz]
        default: ci-full
      rust_toolchain:
        description: the Rust toolchain of every job (ARCH-POS-12)
        type: string
        default: "1.97.1"

# One Rust toolchain for every job (ARCH-POS-12): 1.97.1 = the root rust-toolchain.toml unless a manual run names another.
# RUSTUP_TOOLCHAIN makes every cargo / rustc call use it (workflow env cannot read env, hence the expression twice).
env:
  RUST_TOOLCHAIN: ${{ inputs.rust_toolchain || '1.97.1' }}
  RUSTUP_TOOLCHAIN: ${{ inputs.rust_toolchain || '1.97.1' }}

jobs:
  # Which jobs this run needs (.github/ci_changes.py: a job runs when a path it reads changed, or when a ci-full-* label
  # or the manual run's choice names its group); a push to main, a change under .github/, or a failed diff runs every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      contract_evm: ${{ steps.f.outputs.contract_evm }}
      contract_soroban: ${{ steps.f.outputs.contract_soroban }}
      contract_solana: ${{ steps.f.outputs.contract_solana }}
      contract_near: ${{ steps.f.outputs.contract_near }}
      contract_algorand: ${{ steps.f.outputs.contract_algorand }}
      contract_aptos: ${{ steps.f.outputs.contract_aptos }}
      contract_sui: ${{ steps.f.outputs.contract_sui }}
      contract_cosmos: ${{ steps.f.outputs.contract_cosmos }}
      contract_ton: ${{ steps.f.outputs.contract_ton }}
      node: ${{ steps.f.outputs.node }}
      scaas_rpc: ${{ steps.f.outputs.scaas_rpc }}
      docs: ${{ steps.f.outputs.docs }}
      clientkeys: ${{ steps.f.outputs.clientkeys }}
      pqz: ${{ steps.f.outputs.pqz }}
      zether_prover: ${{ steps.f.outputs.zether_prover }}
      scaas_ct: ${{ steps.f.outputs.scaas_ct }}
      ua_rs: ${{ steps.f.outputs.ua_rs }}
      ua_cxx: ${{ steps.f.outputs.ua_cxx }}
      ua_c: ${{ steps.f.outputs.ua_c }}
      ua_qt: ${{ steps.f.outputs.ua_qt }}
      ua_py: ${{ steps.f.outputs.ua_py }}
      ua_go: ${{ steps.f.outputs.ua_go }}
      ua_cs: ${{ steps.f.outputs.ua_cs }}
      ua_dart_frb: ${{ steps.f.outputs.ua_dart_frb }}
      ua_deps: ${{ steps.f.outputs.ua_deps }}
      ua_dart: ${{ steps.f.outputs.ua_dart }}
      scaas_sdk: ${{ steps.f.outputs.scaas_sdk }}
      scaas_sdk_wasm: ${{ steps.f.outputs.scaas_sdk_wasm }}
      scaas_sdk_bindings: ${{ steps.f.outputs.scaas_sdk_bindings }}
      scaas_sdk_cpp: ${{ steps.f.outputs.scaas_sdk_cpp }}
      scaas_sdk_cs: ${{ steps.f.outputs.scaas_sdk_cs }}
      scaas_sdk_python: ${{ steps.f.outputs.scaas_sdk_python }}
      scaas_sdk_kotlin: ${{ steps.f.outputs.scaas_sdk_kotlin }}
      scaas_sdk_swift: ${{ steps.f.outputs.scaas_sdk_swift }}
      scaas_sdk_js: ${{ steps.f.outputs.scaas_sdk_js }}
      scaas_sdk_java: ${{ steps.f.outputs.scaas_sdk_java }}
      scaas_sdk_go: ${{ steps.f.outputs.scaas_sdk_go }}
      scaas_cli: ${{ steps.f.outputs.scaas_cli }}
      keystore_vectors: ${{ steps.f.outputs.keystore_vectors }}
      test_features: ${{ steps.f.outputs.test_features }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          FULL: ${{ inputs.full }}
        run: python3 .github/ci_changes.py

  # PQZ contracts are built for one parameter set (src/pqz/PqzSet.sol): every set runs the whole suite (AGENTS.md).
  # n2304-kmax4096 is the committed set (gen_set.py --check), so its cell is the default-set `forge test` and also runs
  # the once-only steps.
  contract-evm:
    needs: changes
    if: needs.changes.outputs.contract_evm == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        set: [n2048-kmax1024, n2304-kmax4096, n2560-kmax16384, n2816-kmax65536]
    defaults:
      run:
        working-directory: smartcontracts/evm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # legacy_artifacts.py exports the pre-split src (d142b57c) with git archive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5 # the forge every local build, gas figure and KAT was made with (stable drifts; Amsterdam since F185)
      # lib/ is not committed: install the pinned commits and check their sources (CTR-GEN-01, scripts/evm_libs.sh).
      - name: Libraries at pinned commits
        run: |
          ../../scripts/evm_libs.sh install
          ../../scripts/evm_libs.sh check
      # the differential tests (test/modules/LegacyDiff.sol) read the pre-split releases, built here (not committed)
      - name: pre-split releases (legacy_artifacts.py build)
        run: python3 -I script/modules/legacy_artifacts.py build
      # the committed PqzSet.sol and every other generated file equal set.toml's (review 3w u5-2: set.toml changes in
      # contract rounds, where the core gate does not run)
      - name: gen_set.py --all --check
        if: matrix.set == 'n2304-kmax4096'
        run: python3 -I ../../pqz-core/params/sets/gen_set.py --all --check
      # test/modules/* compares with the pre-split releases, built here at the committed set only: at another set the
      # pre-split side must be rebuilt at that set (at-set.sh's `modules` scope, under scripts/capped: local), so the
      # other cells leave it out
      - name: forge test at ${{ matrix.set }} (at-set.sh)
        run: |
          if [ "${{ matrix.set }}" = n2304-kmax4096 ]; then script/pqz/at-set.sh ${{ matrix.set }} test
          else script/pqz/at-set.sh ${{ matrix.set }} test --no-match-path 'test/modules/*'; fi
      # the registry's gas bounds (msig at verifyBudget, stored-member bound, T-GAS) hold cold: every call its own tx
      - name: forge test --isolate (UAGas, UARegistryGroups)
        if: matrix.set == 'n2304-kmax4096'
        run: forge test --isolate --match-path 'test/ua/{UAGas,UARegistryGroups}.t.sol'
      - name: size gate (CTR-TOK-24, ratchet)
        if: matrix.set == 'n2304-kmax4096'
        run: |
          python3 ../../scripts/size_gate.py --self-test
          forge build src --sizes --json > "$RUNNER_TEMP"/sizes.json || true
          python3 ../../scripts/size_gate.py "$RUNNER_TEMP"/sizes.json size-baseline.json
      - name: forge build (scaas-testnet profile)
        if: matrix.set == 'n2304-kmax4096'
        run: FOUNDRY_PROFILE=scaas-testnet forge build
      # the deploy tooling's own tests (script/test_*.py, offline) and NET-EVM-18's anvil runs: the fixtures at cancun with
      # the CLZ control red, the control green at osaka and void there, PqChatStore's deploy path at cancun (review P3-7)
      - name: script tests and the NET-EVM-18 anvil runs
        if: matrix.set == 'n2304-kmax4096'
        run: |
          for t in script/test_*.py; do echo "## $t"; python3 "$t" || exit 1; done
          T="$RUNNER_TEMP"/forkcheck
          forge build src/pqchat/PqChatStore.sol test/forkcheck --extra-output evm.legacyAssembly --out "$T"/out --cache-path "$T"/cache
          python3 -I script/forkcheck.py exec cancun test/forkcheck/cases.json --out "$T"/out
          python3 -I script/forkcheck.py control cancun --out "$T"/out
          python3 -I script/deploy_pqchatstore.py local --out "$T"/out

  contract-soroban:
    needs: changes
    if: needs.changes.outputs.contract_soroban == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smartcontracts/soroban
      # host tests only: test.sh soroban does not build the wasm, so no stellar CLI here
      - name: test.sh soroban
        run: smartcontracts/scripts/test.sh soroban

  contract-solana:
    needs: changes
    if: needs.changes.outputs.contract_solana == 'true'
    runs-on: ubuntu-latest
    env:
      AGAVE: v4.3.0
      AGAVE_SHA256: c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8 # GitHub release asset digest; binaries byte-identical to the local install
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }} # host tests; cargo build-sbf brings its own rustc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smartcontracts/solana
      # build.sh solana puts ~/.local/share/solana/install/active_release/bin on PATH, where agave-install puts it locally
      - name: Agave ${{ env.AGAVE }} (official release tarball)
        run: |
          curl -sSfL -o "$RUNNER_TEMP"/agave.tar.bz2 "https://github.com/anza-xyz/agave/releases/download/$AGAVE/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "$AGAVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum -c -
          mkdir -p ~/.local/share/solana/install
          tar -xjf "$RUNNER_TEMP"/agave.tar.bz2 -C ~/.local/share/solana/install
          mv ~/.local/share/solana/install/solana-release ~/.local/share/solana/install/active_release
          ~/.local/share/solana/install/active_release/bin/cargo-build-sbf --version
      # cargo build-sbf downloads its platform tools (v1.57 for Agave 4.3.0) into ~/.cache/solana on first use
      - uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-${{ env.AGAVE }}
      - name: test.sh solana
        run: smartcontracts/scripts/test.sh solana

  contract-near:
    needs: changes
    if: needs.changes.outputs.contract_near == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smartcontracts/near
      # cargo-near depends on hidapi, whose build script needs libudev
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: cargo-near
        run: cargo install cargo-near --version 0.22.0 --locked
      # build + unit + near-workspaces tests on near-sandbox (fetched by near-workspaces; one sandbox at a time)
      - name: test.sh near
        run: smartcontracts/scripts/test.sh near

  # test.sh algorand's last step (pytest on the localnet, started by algokit in docker) is local only, like every
  # family's localnet e2e: the steps below are test.sh algorand without it.
  contract-algorand:
    needs: changes
    if: needs.changes.outputs.contract_algorand == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build (puyapy, artifacts.json --check)
        run: ALGORAND_ARTIFACTS_CHECK=1 smartcontracts/scripts/build.sh algorand
      - name: vectors --check
        run: smartcontracts/algorand/.venv/bin/python -I smartcontracts/algorand/scripts/gen_vectors.py --check
      - name: deploy.py unit
        run: smartcontracts/algorand/.venv/bin/python -I -W ignore smartcontracts/algorand/scripts/test_deploy.py

  contract-aptos:
    needs: changes
    if: needs.changes.outputs.contract_aptos == 'true'
    runs-on: ubuntu-latest
    env:
      APTOS: 9.6.0
      APTOS_SHA256: 4e28e71659a53e8eacff29d127685f2f282a8c008ff6e51047daedc72576bb8d # GitHub release asset digest; Linux-x86_64, byte-identical to the local binary
    steps:
      - uses: actions/checkout@v4
      - name: aptos CLI ${{ env.APTOS }} (official release zip)
        run: |
          curl -sSfL -o "$RUNNER_TEMP"/aptos.zip "https://github.com/aptos-labs/aptos-core/releases/download/aptos-cli-v$APTOS/aptos-cli-$APTOS-Linux-x86_64.zip"
          echo "$APTOS_SHA256  $RUNNER_TEMP/aptos.zip" | sha256sum -c -
          mkdir -p ~/.local/bin && unzip -o "$RUNNER_TEMP"/aptos.zip aptos -d ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/aptos --version
      # AptosFramework at the rev pinned in Move.toml (fetched once: --skip-fetch-latest-git-deps only skips updates)
      - name: test.sh aptos
        run: smartcontracts/scripts/test.sh aptos

  contract-sui:
    needs: changes
    if: needs.changes.outputs.contract_sui == 'true'
    runs-on: ubuntu-latest
    env:
      SUI: testnet-v1.81.0 # sui 1.81.0-bf0c491c17b8, the local CLI
      SUI_SHA256: e0b38c877fd0c84d559ffa165a65af2fb47bd7b0e2a6413deac6f9e59ee6c31b # GitHub release asset digest; its `sui` is byte-identical to the local one
    steps:
      - uses: actions/checkout@v4
      # the release tarball is ~1.1 GB (every Sui binary): keep only `sui`, cached by version
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sui
          key: sui-cli-${{ env.SUI }}-${{ env.SUI_SHA256 }}
      - name: sui CLI ${{ env.SUI }} (official release tarball)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP"/sui.tgz "https://github.com/MystenLabs/sui/releases/download/$SUI/sui-$SUI-ubuntu-x86_64.tgz"
          echo "$SUI_SHA256  $RUNNER_TEMP/sui.tgz" | sha256sum -c -
          mkdir -p ~/.local/bin && tar -xzf "$RUNNER_TEMP"/sui.tgz -C ~/.local/bin ./sui
          rm "$RUNNER_TEMP"/sui.tgz
      - run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/sui --version
      # the framework at the rev pinned in Move.lock
      - name: test.sh sui
        run: smartcontracts/scripts/test.sh sui

  contract-cosmos:
    needs: changes
    if: needs.changes.outputs.contract_cosmos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smartcontracts/cosmos
      - name: test.sh cosmos
        run: smartcontracts/scripts/test.sh cosmos

  contract-ton:
    needs: changes
    if: needs.changes.outputs.contract_ton == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1 # the local node; package-lock.json pins no engine above >= 20
          cache: npm
          cache-dependency-path: smartcontracts/ton/package-lock.json
      # npm ci (lockfile) + npm test (tact build, jest on @ton/sandbox)
      - name: test.sh ton
        run: smartcontracts/scripts/test.sh ton

  # the network crate (CLI-RPC-01): endpoint lists, failover and strict majority, the bounded transport, the scaas-node client
  scaas-rpc:
    needs: changes
    if: needs.changes.outputs.scaas_rpc == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/scaas-rpc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-rpc
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: cargo test
        run: cargo test --locked --all-features
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: strict majority, broadcast and transaction state on three anvils
        run: cargo test --locked --features evm --test anvil -- --ignored
      - name: compiles for wasm32 (not run)
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features evm,node-client
      - name: no tokio timer in the crate (F18)
        run: "! git grep -n 'tokio::time' -- src"

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaas-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scaas-node
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5 # the forge every local build, gas figure and KAT was made with (stable drifts; Amsterdam since F185)
      - name: Contract libraries for the e2e deploy script
        working-directory: smartcontracts/evm
        run: |
          ../../scripts/evm_libs.sh install
          ../../scripts/evm_libs.sh check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the Algorand adapter's unit tests read the compiled apps (git-ignored smartcontracts/algorand/out)
      - name: Algorand artifacts for the adapter tests
        working-directory: .
        run: ALGORAND_ARTIFACTS_CHECK=1 smartcontracts/scripts/build.sh algorand
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: unit + proptest
        run: cargo test
      # the e2e signs through clients/clientkeys (zetherPop and others): its node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: clientkeys dependencies for the e2e
        working-directory: clients/clientkeys
        run: npm ci --ignore-scripts
      # and through zether-cli (relayed_zether_proof_under_the_ua_tag; ZETHER_CLI's default path); the test's proveBurn is a raw
      # command, built only with `hazmat` (ARCH-POS-13): a test binary of this job, never shipped
      - name: zether-cli for the e2e
        working-directory: clients/zether-prover
        run: cargo build --release --bin zether-cli --features hazmat
      - name: e2e on anvil
        run: cargo test --test e2e -- --ignored --test-threads=1

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checker self-test
        run: python3 scripts/test_docs_check.py
      - name: register, links, lint, diagrams (C1-C11)
        run: python3 scripts/docs_check.py check
      - name: fact ledger
        run: python3 scripts/docs_check.py facts check
      - name: no machine paths in tracked files
        run: python3 scripts/docs_check.py paths
      - name: no consumer name in the node's code (scaas-node/src, scaas-node/tests)
        run: python3 scripts/docs_check.py consumer
      # AGENTS.md Security: no temp path in a committed file ([t]: the step does not match itself)
      - name: no temp paths in tracked files
        run: |
          ! git grep -nE '/[t]mp/' -- . ':!*/legacy/*' ':!docs/history/*'
      # T21 L67: test/vectors/pqz-gas/<set>.json is what the gas table reads; it must equal what the script makes of the
      # precompile rows (pqz-core/nethermind/chain/engine-pqz.json or the provisional ones) and each set's proofs
      - name: PQZ gas table inputs (gas-inputs.py --check)
        run: python3 -I smartcontracts/evm/script/pqz/gas-inputs.py --check

  # Code-format plan F9: every formatter at its pinned version, check mode only (CI never rewrites code); no build, so
  # it runs on every run. Locally: scripts/format.sh fixes, scripts/format.sh --check runs exactly this.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }} # rustfmt of the root rust-toolchain.toml (1.97.1: rustfmt 1.9.0)
          components: rustfmt
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            clients/clientkeys/package-lock.json
            smartcontracts/ton/package-lock.json
      - name: Prettier 3.3.3 (the devDependency of clients/clientkeys)
        working-directory: clients/clientkeys
        run: npm ci --ignore-scripts
      - name: tact-fmt (@tact-lang/compiler 1.6.13, the devDependency of smartcontracts/ton)
        working-directory: smartcontracts/ton
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff 0.16.4 and clang-format 19.1.7 (pinned wheels, hashes checked)
        run: |
          printf '%s\n' \
            'ruff==0.16.4 --hash=sha256:f2d812e482f5a7e02eee26cd73d2a37ebbdf47d795ea63ba1b89110ae93e9fb3' \
            'clang-format==19.1.7 --hash=sha256:f4906fb463dd2033032978f56962caab268c9428a384126b9400543eb667f11c' \
            > "$RUNNER_TEMP/format-req.txt"
          pip install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/format-req.txt"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: shfmt 3.10.0, actionlint 1.7.12, hadolint 2.15.1, movefmt 1.5.3 (release binaries, each checked against the release's sha256)
        run: |
          set -eu
          b=$RUNNER_TEMP/format-bin
          mkdir -p "$b"
          curl -fsSL -o "$b/shfmt" https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          curl -fsSL -o "$b/movefmt" \
            https://github.com/aptos-labs/movefmt/releases/download/v1.5.3/movefmt-v1.5.3-x86_64-unknown-linux-gnu
          curl -fsSL -o "$b/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          curl -fsSL -o "$b/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc "$b/shfmt" \
            c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507 "$b/hadolint" \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$b/actionlint.tgz" \
            6a14ffbd9881be309609b37216d8eec2ed69dda17da6affd4423f826d6cd8d72 "$b/movefmt" | sha256sum -c -
          tar -xzf "$b/actionlint.tgz" -C "$b" actionlint
          chmod +x "$b/shfmt" "$b/hadolint" "$b/actionlint" "$b/movefmt"
          echo "$b" >> "$GITHUB_PATH"
      # the taplo 0.9.3 release publishes no checksums: built from crates.io with its lockfile
      - name: taplo 0.9.3
        run: cargo install taplo-cli --version 0.9.3 --locked
      - name: format check (scripts/format.sh --check)
        run: scripts/format.sh --check

  test-features:
    needs: changes
    if: needs.changes.outputs.test_features == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: no test feature in a production artifact (manifests, feature graphs, positive controls)
        run: python3 scripts/check_test_features.py

  clientkeys:
    needs: changes
    if: needs.changes.outputs.clientkeys == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/clientkeys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install (no lifecycle scripts)
        run: npm ci --ignore-scripts
      # The vendored-bundle tests skip here: the bundle lives in the client repo that embeds scaas.
      - name: unit tests and vectors
        run: npm test
      # As zether-prover's ZetherProverCross: the forge test signs through ffi with this job's node_modules (@noble/post-quantum),
      # skipped by the default profile, run here (ua-mtx-liquidity L1d: an mldsa65 UA's two SCaaS inputs within 2^24).
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: ML-DSA-65 liquidity plan against the DEX (DexLiquidityMldsa, ffi)
        run: |
          cd ../../smartcontracts/evm
          ../../scripts/evm_libs.sh install
          MLDSA_CLIENTKEYS=../../clients/clientkeys forge test --ffi --match-path test/liquidity/DexLiquidityMldsa.t.sol

  # P6e Task 10 / gate A / gate B, at one parameter set (PQZ_SET below) — KAT, the tbox / SV fix checks, the vectors byte for byte
  # (Rust generator and the independent Python checker), the crates' tests, a fuzz smoke on the committed corpora.
  # The full gate (differential, wasm32 replay, 2 h campaigns) is pqz-core/gate.sh, run on the owner's machine.
  pqz:
    needs: changes
    if: needs.changes.outputs.pqz == 'true'
    runs-on: ubuntu-24.04
    # one parameter set end to end (pqz-ffi's default; plan 5h Task 8d: the Rust generator and the Python checker on the
    # same files, review 8d1 M2); the other sets: pqz-core/gate.sh
    env:
      PQZ_SET: n2304-kmax4096
    defaults:
      run:
        working-directory: pqz-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pqz-core/ffi
            pqz-core/stmt
            pqz-core/pqzh/ligero
      - name: generated files in sync (gen_set.py --all --check, to_rust.py --check)
        run: python3 -I params/sets/gen_set.py --all --check && python3 -I pqzl/params/to_rust.py --check
      - name: gate scripts fail on a failing check (gate-controls.sh)
        run: sh gate-controls.sh
      - name: provisional engine schedules carry their set's compiled-in ids (check-provisional-ids.py)
        run: python3 -I nethermind/chain/check-provisional-ids.py
      - name: build (native) and KAT 19/19
        run: |
          cd pqzl && ./build.sh native
          build/native/kat_dump > build/native/kat-pqz.json
          python3 -I kat/check.py "../params/sets/$PQZ_SET/lazer-3330e48-kat.json" build/native/kat-pqz.json
      - name: tbox and SV fix checks
        run: (cd pqzl && ./check_tbox_fixes.sh && sv/check_sv_fixes.sh)
      - name: pqz-vectors --check, pqz_kat.py --check, tamper
        run: |
          (cd ffi && cargo build --release --features prove --bin pqz-vectors && target/release/pqz-vectors --check)
          python3 -I ../smartcontracts/vectors/pqz/pqz_kat.py --check
          (cd ffi && python3 -I vectors/tamper.py)
      - name: cargo test (pqz-stmt, Ligero, pqz-ffi)
        run: |
          (cd stmt && cargo test --release --features "set-$PQZ_SET")
          (cd pqzh/ligero && cargo test --release --features "set-$PQZ_SET")
          (cd ffi && cargo test --release --features prove,test-hooks -- --test-threads 2)
      - name: fuzz smoke (60 s per target, committed corpora)
        run: |
          sed -i 's/--offline //' fuzz/build.sh
          fuzz/build.sh
          for t in precompile mutate codec; do fuzz/run.sh "$t" 60 ci; done

  scaas-ct:
    needs: changes
    if: needs.changes.outputs.scaas_ct == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/scaas-ct
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-ct
      - name: clippy (vectors exposes the ladder trace)
        run: cargo clippy --locked --all-targets --features vectors -- -D warnings
      - name: tests (release and vectors)
        run: |
          cargo test --locked
          cargo test --locked --features vectors

  zether-prover:
    needs: changes
    if: needs.changes.outputs.zether_prover == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/zether-prover
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/zether-prover
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: clippy (default, hazmat)
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features hazmat -- -D warnings
      - name: unit tests and vectors
        run: cargo test
      - name: unit tests and vectors with the raw commands (hazmat, ARCH-POS-13)
        run: cargo test --features hazmat
      - name: wasm build and node smoke
        run: WASM_BINDGEN=wasm-bindgen ./wasm-smoke.sh
      - name: wasm build and node smoke, hazmat (the prover in wasm)
        run: ZETHER_HAZMAT=1 WASM_BINDGEN=wasm-bindgen ./wasm-smoke.sh
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: prover against the tokens (statement differential)
        run: |
          cargo build --release --features hazmat --bin zether-cli
          cd ../../smartcontracts/evm
          ../../scripts/evm_libs.sh install
          ZETHER_CLI=$PWD/../../clients/zether-prover/target/release/zether-cli forge test --ffi --match-path test/zether/ZetherProverCross.t.sol
      # zether-read-balance --rpc, the reading layer (R1-R7), against a local anvil the tests start and stop (ANVIL, default on PATH)
      - name: reading layer against anvil (default, hazmat)
        run: |
          cargo test --locked --test read_balance --bin zether-read-balance -- --include-ignored
          cargo test --locked --features hazmat --test read_balance --bin zether-read-balance -- --include-ignored

  # One cell per feature set (ua-rs-sign MD-5): its clippy and its tests. The default cell is the release build (zether + pqz at
  # n2304-kmax4096) and also runs the PQZ reading layer against anvil; pqz-n2048 is the other PQZ set, release and vectors.
  ua-rs:
    needs: changes
    if: needs.changes.outputs.ua_rs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: default
            features: ""
          - cell: vectors
            features: --features vectors
          - cell: verify-only
            features: --no-default-features
          - cell: signers
            features: --no-default-features --features signers
            tests: --test groups_verify
          - cell: json
            features: --no-default-features --features json
            tests: --test json
          - cell: pq
            features: --no-default-features --features pq
            tests: --test pq --test ua_portable
          - cell: wallet-mlock
            features: --no-default-features --features wallet,mlock,fam-evm,fam-hedera,fam-near,fam-algorand,fam-cosmos,fam-aptos,fam-solana,fam-soroban,fam-sui,fam-ton,fam-dot,fam-btc,fam-arweave
          # plan T42: the core with no family (no fam-*): every UA kind, BIP-39 / BIP-32 / SLIP-10 / BIP-85, FeatureMissing
          - cell: core
            features: --no-default-features --features wallet
            tests: --lib --test core_only --test wallet_pairing --test bls_multi --test wallet_webauthn --test bip85 --test wallet_pq
          - cell: zether-only
            features: --no-default-features --features wallet,zether,mlock
            tests: --lib --test facade_zether
          - cell: pqz-n2048
            features: --no-default-features --features wallet,zether,pqz,pqz-set-n2048-kmax1024,mlock
            tests: --lib --bin pqz-read --test pqz_read --test facade_pqz_state --test facade_pqz --test pqz_backup --test no_oracle
          - cell: pqz-n2048-vectors
            features: --no-default-features --features wallet,zether,pqz,pqz-set-n2048-kmax1024,mlock,vectors
            tests: --test facade_pqz_state --test facade_pqz --test pqz_backup --test no_oracle
          - cell: roots
            features: --no-default-features --features roots
            tests: --test roots
          - cell: app-core
            features: --features app-core,vectors
            tests: --test app_core
          - cell: pqvault
            features: --no-default-features --features pqvault
            tests: --test pqvault_pass
    defaults:
      run:
        working-directory: clients/ua-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/ua-rs
          key: ${{ matrix.cell }}
      - name: clippy (${{ matrix.cell }})
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: test (${{ matrix.cell }})
        run: cargo test --locked ${{ matrix.features }} ${{ matrix.tests }}
      # the rows every binding decrypts (smartcontracts/vectors/pqz/gen_wallet_state.sh without capped): fixed draws, the same bytes
      - name: wallet_state.json is what its generator writes
        if: matrix.cell == 'vectors'
        run: |
          cargo test --locked --features vectors --test pqz_wallet_rows -- --ignored --exact write_wallet_rows
          git diff --exit-code -- ../../smartcontracts/vectors/pqz/n2304-kmax4096/wallet_state.json
      - uses: foundry-rs/foundry-toolchain@v1
        if: matrix.cell == 'default'
        with:
          version: v1.8.5
      # pqz-read, the PQZ reading layer (R1-R7), against a local anvil the tests start and stop (ANVIL, default on PATH)
      - name: pqz-read against anvil
        if: matrix.cell == 'default'
        run: cargo test --locked --test pqz_read --bin pqz-read -- --include-ignored

  # Plan T42 (CLI-SDK-33 (31)): ua-rs with no family, each fam-<row> alone and all on, built in release, the size of each
  # build's size probe printed (clients/ua-rs/runs/fam-sizes.sh; the record is clients/scaas-sdk/runs/2026-11-17-scaas-sdk-t42-sizes.txt)
  ua-rs-features:
    needs: changes
    if: needs.changes.outputs.ua_rs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/ua-rs
          key: fam
      - name: none, each family alone, all on (release, sizes)
        run: CAP='' bash runs/fam-sizes.sh

  # Compile only (no run; plan T0 had no NDK or Xcode, so Android and iOS are built here first). Falcon's C is skipped on wasm32
  # (KIND_UNAVAILABLE there), compiled by the NDK's clang and by Xcode.
  ua-rs-targets:
    needs: changes
    if: needs.changes.outputs.ua_rs == 'true'
    runs-on: ${{ matrix.os }}
    env:
      # aarch64-apple-ios: stack probes (___chkstk_darwin, from frames above one page) are in libSystem from iOS 13 only
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
            os: ubuntu-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: aarch64-apple-ios
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clients/ua-rs
            clients/ua-c
          key: ${{ matrix.target }}
      # the NDK the runner image carries; API 24
      - name: NDK clang
        if: matrix.target == 'aarch64-linux-android'
        run: |
          b="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$b/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$b/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$b/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: ua-rs, every feature cell
        working-directory: clients/ua-rs
        run: |
          for f in "" "--no-default-features" "--no-default-features --features signers" "--no-default-features --features json" \
                   "--no-default-features --features pq" "--no-default-features --features wallet" "--no-default-features --features zether" \
                   "--no-default-features --features pqz,pqz-set-n2048-kmax1024"; do
            echo "== ${{ matrix.target }} [$f]"
            # shellcheck disable=SC2086 # $f is a list of flags
            cargo build --locked --lib --target ${{ matrix.target }} $f
          done
      - name: ua-c (libscaas_ua_c, the default build)
        working-directory: clients/ua-c
        run: cargo build --locked --lib --target ${{ matrix.target }}

  # Every lockfile over ua-rs resolves as committed; cargo deny (advisories, bans, licenses, sources) by clients/ua-rs/deny.toml;
  # cargo audit (the RustSec database again, the plan's second reader) with deny.toml's exceptions, one list.
  ua-deps:
    needs: changes
    if: needs.changes.outputs.ua_deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo tree --locked
        run: |
          for m in clients/ua-rs clients/ua-c clients/ua-cxx clients/ua-qt clients/ua-dart-frb/rust clients/ua-rs/fuzz clients/zether-prover scaas-node; do
            cargo tree --locked -e normal --manifest-path "$m/Cargo.toml" > /dev/null || { echo "cargo tree --locked failed: $m"; exit 1; }
          done
      # T21 L68: ua-cxx, ua-qt and ua-dart-frb ship their own locks (another resolution than ua-rs's): checked as well
      - name: cargo deny (ua-rs; ua-c, ua-cxx, ua-qt, ua-dart-frb/rust and zether-prover by ua-rs's deny.toml)
        run: |
          (cd clients/ua-rs && cargo deny --all-features check)
          for d in clients/ua-c clients/ua-cxx clients/ua-qt clients/zether-prover; do
            (cd "$d" && cargo deny --all-features --config ../ua-rs/deny.toml check)
          done
          (cd clients/ua-dart-frb/rust && cargo deny --all-features --config ../../ua-rs/deny.toml check)
      - name: cargo audit (the same six, deny.toml's ignores)
        run: |
          ignore=$(python3 -c 'import tomllib; print(" ".join("--ignore " + a["id"] for a in tomllib.load(open("clients/ua-rs/deny.toml", "rb"))["advisories"]["ignore"]))')
          for d in clients/ua-rs clients/ua-c clients/ua-cxx clients/ua-qt clients/ua-dart-frb/rust clients/zether-prover; do
            # shellcheck disable=SC2086 # $ignore is a list of flags
            (cd "$d" && cargo audit $ignore)
          done

  ua-cxx:
    needs: changes
    if: needs.changes.outputs.ua_cxx == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-cxx
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/ua-cxx
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCAAS_UA_CARGO_TARGET_DIR="$PWD/target"
      - name: build
        run: cmake --build build
      - name: vectors
        run: ctest --test-dir build --output-on-failure

  ua-c:
    needs: changes
    if: needs.changes.outputs.ua_c == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-c
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/ua-c
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: build
        run: cargo build --locked
      - name: test (header drift)
        run: cargo test --locked
      - name: C smoke
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Iinclude tests/smoke.c target/debug/libscaas_ua_c.a -lpthread -ldl -lm -o target/smoke
          target/smoke
          c++ -fsyntax-only -x c++ include/scaas_ua.h
      - name: vectors (ctypes)
        run: python3 -m unittest -v tests.test_vectors
      - name: C smoke under AddressSanitizer
        run: tests/asan-smoke.sh

  ua-qt:
    needs: changes
    if: needs.changes.outputs.ua_qt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev
      - name: Build
        working-directory: clients/ua-qt
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake6"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
      - name: Test
        working-directory: clients/ua-qt/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

  ua-py:
    needs: changes
    if: needs.changes.outputs.ua_py == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/ua-c
      # the wallet surface: libscaas_ua_c (release), where the binding looks for it (clients/ua-c/target/release)
      - name: libscaas_ua_c
        working-directory: clients/ua-c
        run: cargo build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements.txt
      - name: vectors and the wallet
        run: python -m unittest -v tests.test_vectors tests.test_wallet

  ua-go:
    needs: changes
    if: needs.changes.outputs.ua_go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-go
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/ua-c
      # the wallet surface: libscaas_ua_c (release), where the binding looks for it (clients/ua-c/target/release)
      - name: libscaas_ua_c
        working-directory: clients/ua-c
        run: cargo build --release --locked
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: clients/ua-go/go.sum
      - name: vet
        run: go vet ./...
      - name: vectors
        # -count=1: setup-go restores GOCACHE, and Go's test cache does not recheck a file outside the module (the vectors);
        # LD_LIBRARY_PATH: the binding links no run-time search path of the build machine (T21 L56)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/clients/ua-c/target/release
        run: go test -count=1 ./...

  ua-cs:
    needs: changes
    if: needs.changes.outputs.ua_cs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-cs/Scaas.Ua.Tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/ua-c
      # the wallet surface: libscaas_ua_c (release), where the binding looks for it (clients/ua-c/target/release)
      - name: libscaas_ua_c
        working-directory: clients/ua-c
        run: cargo build --release --locked
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: vectors
        run: dotnet test

  ua-dart-frb:
    needs: changes
    if: needs.changes.outputs.ua_dart_frb == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ua-dart-frb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/ua-dart-frb/rust
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get --enforce-lockfile
      - run: cargo build --locked --manifest-path rust/Cargo.toml
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: dart test
      # optional drift guard: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      #   && flutter_rust_bridge_codegen generate && git diff --exit-code

  # the SDK apps call (CLI-SDK-01, plan T20): its tests at the full feature set and the minimal one, the raw entry, clippy, each
  # PQZ set's build and its set-sensitive tests, one PQZ set in the feature tree
  scaas-sdk:
    needs: changes
    if: needs.changes.outputs.scaas_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/scaas-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk
      - name: cargo test (full feature set)
        run: cargo test --locked --features vault,account,wallet,zether,pqz,pqz-set-n2304-kmax4096,dex,admin,classical-roots,app-core,pqchat-records,near,algorand,cosmos,aptos,solana,soroban,sui,ton
      - name: the test feature vectors (pqchat-core T1 rows, PqVault V9 rows)
        run: cargo test --locked --features vault,account,wallet,zether,pqz,pqz-set-n2304-kmax4096,dex,admin,classical-roots,app-core,pqchat-records,near,algorand,cosmos,aptos,solana,soroban,sui,ton,vectors --test pqchat_keys --test app_core_vault_rows
      - name: cargo test (vault and file store only)
        run: cargo test --locked --no-default-features --features vault,file-store
      - name: account, wallet and the non-EVM families without evm (T41.evm step 0)
        run: |
          NE=vault,account,wallet,file-store,mlock,near,algorand,cosmos,aptos,solana,soroban,sui,ton,native-networks,raw-native
          cargo test --locked --no-default-features --features "$NE"
          cargo clippy --locked --all-targets --no-default-features --features "$NE" -- -D warnings
      - name: the raw native entry and native networks
        run: cargo test --locked --lib --features vault,account,wallet,zether,pqz,pqz-set-n2304-kmax4096,dex,admin,classical-roots,app-core,pqchat-records,near,algorand,cosmos,aptos,solana,soroban,sui,ton,native-networks,raw-native
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --features vault,account,wallet,zether,pqz,pqz-set-n2304-kmax4096,dex,admin,classical-roots,app-core,pqchat-records,near,algorand,cosmos,aptos,solana,soroban,sui,ton,vectors,native-networks,raw-native -- -D warnings
      - name: each other PQZ set
        run: |
          for s in n2048-kmax1024 n2560-kmax16384 n2816-kmax65536; do
            cargo test --locked --no-default-features --features "vault,account,wallet,pqz,pqz-set-$s" --test sets
          done
      - name: one PQZ set in the feature tree
        run: cargo test --locked --test feature_tree

  scaas-sdk-wasm:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_wasm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/scaas-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk
      - name: compiles for wasm32 (not run)
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features vault,account,wallet,evm

  # the CLI `scaas` (plan T22, CLI-SDK-17): one command per SDK call, both builds (release profiles; dev-profiles)
  scaas-cli:
    needs: changes
    if: needs.changes.outputs.scaas_cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/scaas-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-cli
      - name: cargo test (the release build)
        run: cargo test --locked
      - name: cargo test (dev-profiles)
        run: cargo test --locked --features dev-profiles
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --features dev-profiles -- -D warnings

  # the generated bindings (spec §16): the FRB Dart surface regenerated equals the committed one; the reference library and
  # the Dart tests over it
  scaas-sdk-bindings:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_bindings == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk/ffi
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      # the Dart test's e2e smoke runs a local anvil
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: flutter_rust_bridge_codegen 2.13.0 and cargo-expand 1.0.127 (its scan of the scaas-sdk crate)
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          cargo install cargo-expand --version 1.0.127 --locked
      - name: the generated FRB surface has no drift
        run: SCAAS_GEN=dart bash clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check
      - name: the reference library
        working-directory: clients/scaas-sdk/ffi
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
      - name: dart test
        working-directory: clients/scaas-sdk/bindings/dart
        run: |
          dart pub get --enforce-lockfile
          dart test --reporter expanded

  # the sync C++ surface (plan T20b, spec §16.1 (a′)): generated by uniffi-bindgen-cpp over the reference library with
  # `sync-api`, no drift, its Rust tests and the C++ smoke test
  scaas-sdk-cpp:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clients/scaas-sdk
            clients/scaas-sdk/ffi
      - name: uniffi-bindgen-cpp v0.10.0+v0.31.0
        run: cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cpp --rev c592133cac069d4e870744c1cdf09558b148c9fc --locked uniffi-bindgen-cpp
      - name: the generated C++ has no drift
        run: SCAAS_GEN=cpp bash clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check
      - name: the reference library with each UniFFI surface (review B16)
        working-directory: clients/scaas-sdk/ffi
        run: |
          cargo clippy --locked --all-targets --features sync-api -- -D warnings
          cargo clippy --locked --all-targets --features uniffi -- -D warnings
      - name: the SDK with each UniFFI surface
        working-directory: clients/scaas-sdk
        run: |
          cargo clippy --locked --all-targets --features vault,account,wallet,zether,pqz,pqz-set-n2304-kmax4096,dex,admin,classical-roots,uniffi -- -D warnings
          cargo clippy --locked --all-targets --features vault,account,wallet,zether,pqz,pqz-set-n2304-kmax4096,dex,admin,classical-roots,sync-api -- -D warnings
      - name: the sync surface's Rust tests
        working-directory: clients/scaas-sdk
        run: cargo test --locked --features vault,account,wallet,zether,pqz,pqz-set-n2304-kmax4096,dex,admin,classical-roots,sync-api --test binding
      - name: the C++ smoke test
        working-directory: clients/scaas-sdk/bindings/cpp
        run: |
          cmake -B build
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

  # the C# binding (plan T20c, spec §16.1): generated by uniffi-bindgen-cs over the reference library with the async API, no
  # drift, the dotnet smoke test
  scaas-sdk-cs:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_cs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk/ffi
      - name: uniffi-bindgen-cs v0.11.1+v0.31.0
        run: cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs --rev 7b1aaae16388a8d1e739114a632f357e1926296e --locked uniffi-bindgen-cs
      - name: the generated C# has no drift
        run: SCAAS_GEN=cs bash clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: the C# smoke test
        working-directory: clients/scaas-sdk/bindings/cs
        run: dotnet test

  # the Python binding (plan T20d, spec §16.1): generated by official UniFFI over the reference library with the async API,
  # no drift, the unittest smoke
  scaas-sdk-python:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk/ffi
      - name: uniffi-bindgen 0.31.0
        run: cargo install uniffi --version =0.31.0 --features cli --locked
      - name: the generated Python has no drift
        run: SCAAS_GEN=python bash clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check
      - name: the Python smoke test
        working-directory: clients/scaas-sdk/bindings/python
        run: |
          python3 -I test_fix_generated.py
          python3 -I test_smoke.py

  # the Kotlin binding (plan T20e, spec §16.1): generated by official UniFFI over the reference library with the async API, no
  # drift, the JVM smoke
  scaas-sdk-kotlin:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk/ffi
      - name: uniffi-bindgen 0.31.0
        run: cargo install uniffi --version =0.31.0 --features cli --locked
      - name: the generated Kotlin has no drift
        run: SCAAS_GEN=kotlin bash clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: kotlinc 2.4.21
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlinc.zip" https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  $RUNNER_TEMP/kotlinc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "KOTLINC=$RUNNER_TEMP/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"
      - name: the Kotlin smoke test
        working-directory: clients/scaas-sdk/bindings/kotlin
        run: bash run.sh

  # the Swift binding (plan T20f, spec §16.1): generated by official UniFFI over the reference library with the async API, no
  # drift, the smoke on Linux
  scaas-sdk-swift:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_swift == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk/ffi
      - name: uniffi-bindgen 0.31.0
        run: cargo install uniffi --version =0.31.0 --features cli --locked
      - name: the generated Swift has no drift
        run: SCAAS_GEN=swift bash clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check
      - name: Swift 6.4.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swift.tar.gz" https://download.swift.org/swift-6.4.2-release/ubuntu2404/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu24.04.tar.gz
          echo "2e9ebec040ad459dd89a6d093a02d8314939135104850fae4d5c0f174fb3ba8c  $RUNNER_TEMP/swift.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/swift"
          tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP/swift" --strip-components=1
          echo "SWIFTC=$RUNNER_TEMP/swift/usr/bin/swiftc" >> "$GITHUB_ENV"
      - name: the Swift smoke test
        working-directory: clients/scaas-sdk/bindings/swift
        run: bash run.sh

  # the JS / TS binding (plan T20g, spec §16.4): the SDK with feature `wasm` for wasm32, wasm-bindgen's glue, the Node smoke
  scaas-sdk-js:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clients/scaas-sdk
            clients/scaas-sdk/bindings/js
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - name: wasm-bindgen-cli 0.2.130
        run: cargo install wasm-bindgen-cli --version =0.2.130 --locked
      - name: the SDK with feature wasm for wasm32
        working-directory: clients/scaas-sdk
        run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features vault,account,wallet,zether,pqz,pqz-set-n2304-kmax4096,dex,admin,classical-roots,wasm -- -D warnings
      - name: the JS smoke test
        working-directory: clients/scaas-sdk/bindings/js
        run: bash run.sh

  # the Java binding (plan T20e2, spec §16.1): generated by uniffi-bindgen-java over the reference library with the async API
  # (three generator defects fixed by fix_generated.py), no drift, the JVM smoke
  scaas-sdk-java:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk/ffi
      - name: uniffi-bindgen-java 0.4.2
        run: cargo install uniffi-bindgen-java --version =0.4.2 --locked
      - name: the generated Java has no drift
        run: SCAAS_GEN=java bash clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: the Java smoke test
        working-directory: clients/scaas-sdk/bindings/java
        run: |
          python3 -I test_fix_generated.py
          bash run.sh

  # the Go binding (plan T20h, spec §16.1): generated by uniffi-bindgen-go over the reference library with the async API, no
  # drift, the go test smoke
  scaas-sdk-go:
    needs: changes
    if: needs.changes.outputs.scaas_sdk_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk/ffi
      - name: uniffi-bindgen-go v0.7.1+v0.31.0
        run: cargo install uniffi-bindgen-go --git https://github.com/NordSecurity/uniffi-bindgen-go --rev 0b7fb4ceef12021bd7f790cc516fa9133e001813 --locked
      - name: the generated Go has no drift
        run: SCAAS_GEN=go bash clients/scaas-sdk/runs/2026-11-17-scaas-sdk-gen.sh --check
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: the Go smoke test
        working-directory: clients/scaas-sdk/bindings/go
        run: |
          python3 -I test_fix_generated.py
          bash run.sh

  # the keystore container's vectors (plan T2b, T2c): clientkeys writes them, the SDK reads every row
  keystore-vectors:
    needs: changes
    if: needs.changes.outputs.keystore_vectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: clients/clientkeys/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/scaas-sdk
      - name: clientkeys
        working-directory: clients/clientkeys
        run: |
          npm ci --ignore-scripts
          node --test test/keystore.test.js test/keystore-index.test.js test/vault.test.js
      - name: scaas-sdk
        working-directory: clients/scaas-sdk
        run: cargo test --locked --test keystore_vectors

  ua-dart:
    needs: changes
    if: needs.changes.outputs.ua_dart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dart pub get
        working-directory: clients/ua-dart
      - run: dart analyze
        working-directory: clients/ua-dart
      - run: dart test
        working-directory: clients/ua-dart
      - run: dart test -p node
        working-directory: clients/ua-dart
      # asserts are off here (plain `dart run`), like a release build
      - run: dart run test/vectors_test.dart
        working-directory: clients/ua-dart
