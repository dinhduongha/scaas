<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Settlement kinds</title>
  <desc id="d">Twelve settlement kinds grouped by who checks them. The token checks: typed transfer and payment (built, v2 tiers), receiver pays (built on EVM and Hedera), signature wrap (built, P2a), confidential Zether (built, unaudited, dev chains only). Other contracts take part: generic gasless call through the selector allowlist (built), DEX order book (token side built, P2a), exchange against AMMs (built, P2c), mandate through MandateWallet (built), asset-suite actions (specified, nothing built), tender (specified, nothing built). Elsewhere: gas sponsorship by node policy (specified; SponsorshipPool planned) and the non-EVM families (built as MetaOp v1; target specified).</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #57606a; }
      .tier { font-size: 15px; font-weight: 700; }
      .tiers { font-size: 12px; fill: #57606a; }
      .b { font-size: 13.5px; font-weight: 700; }
      .s { font-size: 11px; fill: #424a53; }
      .lab { font-size: 11.5px; fill: #424a53; }
      .chip { font-size: 10px; font-weight: 700; }
      .flow { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .back { stroke: #57606a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .card { fill: #ffffff; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="539" rx="16" fill="#f8fafc" stroke="#d0d7de"/>
  <text class="h" x="24" y="40">Settlement kinds</text>
  <text class="sub" x="24" y="61">Every kind: a signed EIP-712 intent · anyone submits, the relayer pays gas · fee in the token · all or nothing</text>
  <rect x="16" y="78" width="306" height="370" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text class="tier" x="30" y="102">The token checks</text>
  <rect class="card" stroke="#16a34a" x="28" y="112" width="282" height="76" rx="8"/>
  <text class="b" x="40" y="133">Typed transfer / payment</text>
  <text class="s" x="40" y="155">mtxExecuteTransfer, mtxPay, payWithFee</text>
  <rect x="40" y="165" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="61" y="177" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="s" x="88" y="177">v2 tiers</text>
  <rect class="card" stroke="#16a34a" x="28" y="195" width="282" height="76" rx="8"/>
  <text class="b" x="40" y="216">Receiver pays</text>
  <text class="s" x="40" y="238">mtxPayReceiverFee; the payee co-signs</text>
  <rect x="40" y="248" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="61" y="260" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="s" x="88" y="260">EVM, Hedera</text>
  <rect class="card" stroke="#16a34a" x="28" y="278" width="282" height="76" rx="8"/>
  <text class="b" x="40" y="299">Signature wrap</text>
  <text class="s" x="40" y="321">mtxWrap: a TradeOrder in the underlying</text>
  <rect x="40" y="331" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="61" y="343" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="s" x="88" y="343">P2a, WrappedToken</text>
  <rect class="card" stroke="#16a34a" x="28" y="361" width="282" height="76" rx="8"/>
  <text class="b" x="40" y="382">Confidential (Zether)</text>
  <text class="s" x="40" y="404">built: transferConfidential*, fund, burn</text>
  <rect x="40" y="414" width="110" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="95" y="426" text-anchor="middle" fill="#1a7f37">BUILT, UNAUDITED</text>
  <text class="s" x="156" y="426">dev chains only</text>
  <rect x="332" y="78" width="612" height="288" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="tier" x="346" y="102">Another contract takes part in the check</text>
  <rect class="card" stroke="#3b82f6" x="344" y="112" width="288" height="76" rx="8"/>
  <text class="b" x="356" y="133">Generic gasless call</text>
  <text class="s" x="356" y="155">mtxExecute: the selector allowlist</text>
  <rect x="356" y="165" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="377" y="177" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="s" x="404" y="177"></text>
  <rect class="card" stroke="#3b82f6" x="641" y="112" width="288" height="76" rx="8"/>
  <text class="b" x="653" y="133">DEX order book</text>
  <text class="s" x="653" y="155">SCaaSDex.mtxSettle; token side mtxTrade</text>
  <rect x="653" y="165" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="674" y="177" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="s" x="701" y="177">token side (P2a)</text>
  <rect class="card" stroke="#3b82f6" x="344" y="195" width="288" height="76" rx="8"/>
  <text class="b" x="356" y="216">Exchange against AMMs</text>
  <text class="s" x="356" y="238">mtxExchange, mtxExchangeVia</text>
  <rect x="356" y="248" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="377" y="260" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="s" x="404" y="260">P2c, SCaaSDex</text>
  <rect class="card" stroke="#3b82f6" x="641" y="195" width="288" height="76" rx="8"/>
  <text class="b" x="653" y="216">Mandate</text>
  <text class="s" x="653" y="238">payUnderMandate, checked by MandateWallet</text>
  <rect x="653" y="248" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="674" y="260" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="s" x="701" y="260"></text>
  <rect class="card" stroke="#3b82f6" x="344" y="278" width="288" height="76" rx="8"/>
  <text class="b" x="356" y="299">Asset-suite action</text>
  <text class="s" x="356" y="321">forced transfer, vesting, distributions</text>
  <rect x="356" y="331" width="70" height="16" rx="8" fill="#ddf4ff"/><text class="chip" x="391" y="343" text-anchor="middle" fill="#0969da">SPECIFIED</text>
  <text class="s" x="432" y="343">nothing built</text>
  <rect class="card" stroke="#3b82f6" x="641" y="278" width="288" height="76" rx="8"/>
  <text class="b" x="653" y="299">Tender</text>
  <text class="s" x="653" y="321">commitBid, revealBid, withdrawDeposit</text>
  <rect x="653" y="331" width="70" height="16" rx="8" fill="#ddf4ff"/><text class="chip" x="688" y="343" text-anchor="middle" fill="#0969da">SPECIFIED</text>
  <text class="s" x="729" y="343">nothing built</text>
  <rect x="332" y="376" width="612" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <rect class="card" stroke="#7c3aed" x="344" y="384" width="288" height="56" rx="8"/>
  <text class="b" x="356" y="405">Gas sponsorship (node policy)</text>
  <rect x="356" y="415" width="70" height="16" rx="8" fill="#ddf4ff"/><text class="chip" x="391" y="427" text-anchor="middle" fill="#0969da">SPECIFIED</text>
  <text class="s" x="432" y="427">policy · SponsorshipPool PLANNED</text>
  <rect class="card" stroke="#7c3aed" x="641" y="384" width="288" height="56" rx="8"/>
  <text class="b" x="653" y="405">Non-EVM families: mtx_pay, mtx_…</text>
  <rect x="653" y="415" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="674" y="427" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="s" x="701" y="427">as MetaOp v1 · target SPECIFIED</text>
  <rect x="24" y="470" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="45" y="482" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="lab" x="74" y="482">in the code today</text>
  <rect x="203.4" y="470" width="70" height="16" rx="8" fill="#ddf4ff"/><text class="chip" x="238.4" y="482" text-anchor="middle" fill="#0969da">SPECIFIED</text>
  <text class="lab" x="281.4" y="482">designed, not built</text>
  <rect x="423.2" y="470" width="60" height="16" rx="8" fill="#fff8c5"/><text class="chip" x="453.2" y="482" text-anchor="middle" fill="#9a6700">PLANNED</text>
  <text class="lab" x="491.20000000000005" y="482">direction, not yet specified in detail</text>
  <text class="lab" x="24" y="514">Fee: none, a percent or a fixed amount in the token, chosen by the signer within a cap · final after the chain’s finality gate</text>
</svg>
