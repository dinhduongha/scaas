<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="t d">
  <title id="t">Accounts and keys</title>
  <desc id="d">Three account forms. Native account: the chain’s own account (EVM EOA or ERC-1271 contract, Solana, Stellar, Aptos, Sui, Cosmos, TON), no registration. Universal Account, the default (specified, nothing built): an id derived from key data or a policy, for passkeys, P-256, ed25519, Schnorr, BLS, MuSig2 and FROST groups, weighted multisig, post-quantum and Zether keys, registered once per chain in the UARegistry with proof of possession. SmartKeyAccount, optional (built, on MetaTxBase): an ERC-1271 clone from SmartKeyAccountFactory with several P-256 passkey and secp256k1 keys and guardian recovery. A passkey can serve as a UA or as a SmartKeyAccount key. Every token kind accepts all three forms and verifies the signature itself. MandateWallet (built, on MetaTxBase with a revocation epoch) is a payment authority, not an account: the payer owns it and deposits into it, a delegate pays approved payees within per-payment and per-period caps until expiry or revocation.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #57606a; }
      .tier { font-size: 15px; font-weight: 700; }
      .tiers { font-size: 12px; fill: #57606a; }
      .b { font-size: 13.5px; font-weight: 700; }
      .s { font-size: 11px; fill: #424a53; }
      .lab { font-size: 11.5px; fill: #424a53; }
      .n { font-size: 10.5px; font-style: italic; fill: #57606a; }
      .chip { font-size: 10px; font-weight: 700; }
      .flow { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .back { stroke: #57606a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="579" rx="16" fill="#f8fafc" stroke="#d0d7de"/>
  <text class="h" x="24" y="40">Accounts and keys</text>
  <text class="sub" x="24" y="61">Whoever can produce a valid signature is an account; every contract function names the forms it accepts</text>
  <rect x="16" y="78" width="300" height="236" rx="12" fill="#eaeef2" stroke="#57606a"/>
  <text class="tier" x="30" y="103">Native account</text>
  <text class="s" x="30" y="128">The chain's own account:</text>
  <text class="s" x="30" y="147">an EVM address (EOA, or a contract</text>
  <text class="s" x="30" y="166">via ERC-1271); a Solana, Stellar, Aptos,</text>
  <text class="s" x="30" y="185">Sui, Cosmos or TON account</text>
  <text class="s" x="30" y="212">Registration: none</text>
  <text class="s" x="30" y="231">For wallet users and anything a chain</text>
  <text class="s" x="30" y="250">already understands</text>
  <rect x="330" y="78" width="300" height="236" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text class="tier" x="344" y="103">Universal Account</text>
  <rect x="344" y="114" width="70" height="16" rx="8" fill="#ddf4ff"/><text class="chip" x="379" y="126" text-anchor="middle" fill="#0969da">SPECIFIED</text>
  <text class="s" x="420" y="126">the default; nothing built</text>
  <text class="s" x="344" y="150">A 32-byte id derived from key data or a policy:</text>
  <text class="s" x="344" y="169">passkey, P-256, ed25519, Schnorr, BLS,</text>
  <text class="s" x="344" y="188">MuSig2 / FROST groups, weighted multisig,</text>
  <text class="s" x="344" y="207">post-quantum keys, Zether keys</text>
  <text class="s" x="344" y="234">Registered once per chain in the UARegistry,</text>
  <text class="s" x="344" y="253">with proof of possession (derived kinds)</text>
  <text class="s" x="344" y="272">New key data = a new UA (no rotation)</text>
  <rect x="644" y="78" width="300" height="236" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="tier" x="658" y="103">SmartKeyAccount</text>
  <rect x="658" y="114" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="679" y="126" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="s" x="706" y="126">optional smart account</text>
  <text class="s" x="658" y="150">ERC-1271 clone from SmartKeyAccountFactory</text>
  <text class="s" x="658" y="169">keys: P-256 passkeys and secp256k1;</text>
  <text class="s" x="658" y="188">never zero keys</text>
  <text class="s" x="658" y="207">guardian initiateRecovery(newKey), then</text>
  <text class="s" x="658" y="226">anyone completeRecovery after the delay</text>
  <text class="s" x="658" y="245">key changes: MetaTransactions signed by</text>
  <text class="s" x="658" y="264">the account itself (stable address)</text>
  <text class="n" x="658" y="283">on MetaTxBase, domain SCaaS SmartKeyAccount</text>
  <rect x="430" y="300" width="420" height="26" rx="13" fill="#ffffff" stroke="#57606a" stroke-dasharray="4 3"/>
  <text class="lab" x="640" y="317" text-anchor="middle">a passkey can be a webauthn-p256 UA or a SmartKeyAccount key</text>
  <line class="flow" x1="166" y1="315" x2="166" y2="352" marker-end="url(#ah)"/>
  <line class="flow" x1="480" y1="327" x2="480" y2="352" marker-end="url(#ah)"/>
  <line class="flow" x1="794" y1="327" x2="794" y2="352" marker-end="url(#ah)"/>
  <rect x="16" y="354" width="928" height="48" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="b" x="30" y="383">Every token kind accepts all three</text>
  <text class="s" x="290" y="383">checked by the token: ECDSA / ERC-1271 · a verifier per UA kind · ERC-1271 (400 k gas cap) for SmartKeyAccount</text>

  <rect x="16" y="420" width="928" height="110" rx="12" fill="#fef3c7" stroke="#d97706"/>
  <text class="tier" x="30" y="445">MandateWallet</text>
  <rect x="150" y="433" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="171" y="445" text-anchor="middle" fill="#1a7f37">BUILT</text><text class="s" x="198" y="445">on MetaTxBase, revocation epoch</text>
  <text class="s" x="30" y="466">A payment authority, not an account: delegated, capped payment from the payer's own wallet</text>
  <rect x="30" y="478" width="150" height="40" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="b" x="105" y="503" text-anchor="middle">Payer (owner)</text>
  <line class="flow" x1="182" y1="498" x2="300" y2="498" marker-end="url(#ah)"/>
  <text class="s" x="241" y="492" text-anchor="middle">deposits</text>
  <rect x="302" y="478" width="300" height="40" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="s" x="452" y="495" text-anchor="middle">per token: delegate, expiry, max per payment,</text>
  <text class="s" x="452" y="510" text-anchor="middle">max per period, allowed payees; revocable</text>
  <line class="flow" x1="604" y1="498" x2="760" y2="498" marker-end="url(#ah)"/>
  <text class="s" x="682" y="492" text-anchor="middle">delegate signs a payment</text>
  <rect x="762" y="478" width="168" height="40" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text class="b" x="846" y="503" text-anchor="middle">Approved payee</text>
  <rect x="24" y="548" width="42" height="16" rx="8" fill="#dafbe1"/><text class="chip" x="45" y="560" text-anchor="middle" fill="#1a7f37">BUILT</text>
  <text class="lab" x="74" y="560">in the code today</text>
  <rect x="203.4" y="548" width="70" height="16" rx="8" fill="#ddf4ff"/><text class="chip" x="238.4" y="560" text-anchor="middle" fill="#0969da">SPECIFIED</text>
  <text class="lab" x="281.4" y="560">designed, not built</text>
</svg>
