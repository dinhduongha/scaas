<svg xmlns="http://www.w3.org/2000/svg" width="960" height="646" viewBox="0 0 960 646" role="img" aria-labelledby="t d">
  <title id="t">Smart chain vs IaaS and BaaS</title>
  <desc id="d">Scorecard of a cloud VM (IaaS), a hosted backend (BaaS) and a smart chain with SCaaS across five rows. Code and data: the chain is worse (seconds to minutes until finality). Money and billing: the chain is better (a native fee in every transaction). Operations and reliability: different (many validators, lock-in to the chain). Who holds the power: the chain wins (the subject signs every write). Privacy and data: the chain is better (Zether and PQ Zether hide amounts and balances; records are immutable, so a mistake is corrected by a new entry). Use the chain for write authority, value and records nobody may rewrite; keep reads, reports and workflows on ordinary infrastructure.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #57606a; }
      .col { font-size: 14px; font-weight: 700; }
      .rl { font-size: 13px; font-weight: 700; }
      .rs { font-size: 12px; fill: #57606a; }
      .b { font-size: 12.5px; font-weight: 700; }
      .s { font-size: 12.5px; fill: #424a53; }
      .chip { font-size: 11.5px; font-weight: 700; }
      .lg { font-size: 12px; fill: #424a53; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="645" rx="16" fill="#f8fafc" stroke="#d0d7de"/>
  <text class="h" x="24" y="40">Smart chain vs IaaS and BaaS</text>
  <text class="sub" x="24" y="61">Five questions: the chain is slower, but wins on money, authority and records nobody can rewrite</text>

  <rect x="206" y="76" width="238" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="col" x="325" y="99" text-anchor="middle">Cloud VM (IaaS)</text>
  <rect x="452" y="76" width="238" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="col" x="571" y="99" text-anchor="middle">Hosted backend (BaaS)</text>
  <rect x="698" y="76" width="238" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="col" x="817" y="99" text-anchor="middle">Smart chain + SCaaS</text>
  <rect x="20" y="124" width="176" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text class="rl" x="30" y="156">a) Code &amp; data</text>
  <text class="rs" x="30" y="174">slower, smaller, dearer</text>
  <rect x="206" y="124" width="238" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="218" y="167">Write latency: milliseconds</text>
  <text class="s" x="218" y="184">Grows with what you rent</text>
  <rect x="452" y="124" width="238" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="464" y="167">Write latency: milliseconds</text>
  <text class="s" x="464" y="184">Grows with the plan</text>
  <rect x="698" y="124" width="238" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="708" y="132" width="56" height="18" rx="9" fill="#dc2626"/><text class="chip" x="736" y="145" text-anchor="middle" style="fill:#ffffff">WORSE</text>
  <text class="b" x="710" y="167">Seconds to minutes, until finality</text>
  <text class="s" x="710" y="184">Block space shared with everyone</text>
  <rect x="20" y="204" width="176" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text class="rl" x="30" y="236">b) Money &amp; billing</text>
  <text class="rs" x="30" y="254">payment is built in</text>
  <rect x="206" y="204" width="238" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="218" y="247">A monthly invoice</text>
  <text class="s" x="218" y="264">Needs a bank or payment processor</text>
  <rect x="452" y="204" width="238" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="464" y="247">A monthly plan or usage invoice</text>
  <text class="s" x="464" y="264">Needs a bank or payment processor</text>
  <rect x="698" y="204" width="238" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="708" y="212" width="64" height="18" rx="9" fill="#16a34a"/><text class="chip" x="740" y="225" text-anchor="middle" style="fill:#ffffff">BETTER</text>
  <text class="b" x="710" y="247">A native fee in every transaction</text>
  <text class="s" x="710" y="264">Value moves as an ordinary call</text>
  <rect x="20" y="284" width="176" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text class="rl" x="30" y="316">c) Operations &amp; reliability</text>
  <text class="rs" x="30" y="334">no single operator</text>
  <rect x="206" y="284" width="238" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="218" y="327">One provider, plus you</text>
  <text class="s" x="218" y="344">Lock-in: provider APIs</text>
  <rect x="452" y="284" width="238" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="464" y="327">One provider</text>
  <text class="s" x="464" y="344">Lock-in: provider-specific APIs</text>
  <rect x="698" y="284" width="238" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="708" y="292" width="88" height="18" rx="9" fill="#d97706"/><text class="chip" x="752" y="305" text-anchor="middle" style="fill:#ffffff">DIFFERENT</text>
  <text class="b" x="710" y="327">Many independent validators</text>
  <text class="s" x="710" y="344">Lock-in is to the chain itself</text>
  <rect x="12" y="359" width="936" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="20" y="364" width="176" height="100" rx="8" fill="#16a34a" stroke="#15803d"/>
  <text class="rl" x="30" y="410" style="fill:#ffffff">d) Who holds the power</text>
  <text class="rs" x="30" y="428" style="fill:#ffffff">where the chain wins</text>
  <rect x="206" y="364" width="238" height="100" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="218" y="418">The app server signs for the user</text>
  <text class="s" x="218" y="435">with a token it issued</text>
  <text class="s" x="218" y="452">Leak: every user impersonated</text>
  <rect x="452" y="364" width="238" height="100" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="464" y="418">The auth service issues the token</text>
  <text class="s" x="464" y="435">The admin key bypasses the rules</text>
  <text class="s" x="464" y="452">Leak: every user impersonated</text>
  <rect x="698" y="364" width="238" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <rect x="708" y="372" width="64" height="18" rx="9" fill="#16a34a"/><text class="chip" x="740" y="385" text-anchor="middle" style="fill:#ffffff">BETTER</text>
  <text class="b" x="710" y="418">The subject signs every write</text>
  <text class="s" x="710" y="435">Nobody can forge it without the key</text>
  <text class="s" x="710" y="452">Relayers can only refuse or delay</text>
  <rect x="20" y="472" width="176" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text class="rl" x="30" y="504">e) Privacy &amp; data</text>
  <text class="rs" x="30" y="522">confidential, tamper-proof</text>
  <rect x="206" y="472" width="238" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="218" y="515">The operator sees all it hosts</text>
  <text class="s" x="218" y="532">Rows can be silently rewritten</text>
  <rect x="452" y="472" width="238" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text class="s" x="464" y="515">The provider sees all it stores</text>
  <text class="s" x="464" y="532">Rows can be silently rewritten</text>
  <rect x="698" y="472" width="238" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="708" y="480" width="64" height="18" rx="9" fill="#16a34a"/><text class="chip" x="740" y="493" text-anchor="middle" style="fill:#ffffff">BETTER</text>
  <text class="b" x="710" y="515" style="font-size:12px">Zether / PQZ hide amounts, balances</text>
  <text class="s" x="710" y="532">Immutable: fixes are new entries</text>
  <text class="lg" x="24" y="566">Verdict for the chain:</text>
  <rect x="170" y="553" width="16" height="16" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text class="lg" x="192" y="566">better than IaaS/BaaS</text>
  <rect x="352.6" y="553" width="16" height="16" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text class="lg" x="374.6" y="566">worse than IaaS/BaaS</text>
  <rect x="528.6" y="553" width="16" height="16" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text class="lg" x="550.6" y="566">different trade-off</text>
  <rect x="698.0" y="553" width="16" height="16" rx="4" fill="#ffffff" stroke="#d0d7de"/><text class="lg" x="720.0" y="566">IaaS / BaaS (neutral)</text>
  <rect x="16" y="588" width="928" height="46" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="b" x="30" y="608" style="font-size:13.5px">f) Which to use for what</text>
  <text class="s" x="30" y="625" style="font-size:13px">Use the chain for write authority, value and records nobody may rewrite; keep reads, reports and workflows on ordinary infrastructure.</text>
</svg>