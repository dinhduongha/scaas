<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">Who pays the fee</title>
  <desc id="d">One signed intent, eight ways to pay for it, grouped by who bears the cost. Subject: self-paid (built), fee in the token capped at 1 percent (built). Company: sponsored by a company relayer with fee 0 (built, portal default), enterprise inbound gateway (built on EVM). Payee: direct settlement by payee self-relay (built on EVM), receiver pays the fee (specified). Sponsor or service company: gas sponsorship policy (specified; on-chain pool planned), sponsored call of a non-token contract (specified).</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #57606a; }
      .col { font-size: 14px; font-weight: 700; }
      .b { font-size: 13.5px; font-weight: 700; }
      .s { font-size: 12px; fill: #424a53; }
      .flow { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .card { fill: #ffffff; stroke: #d0d7de; }
      .chip { font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#f8fafc" stroke="#d0d7de"/>
  <text class="h" x="24" y="40">Who pays the fee</text>
  <text class="sub" x="24" y="61">One signed intent; only the fee fields and the submitter differ</text>

  <rect x="330" y="76" width="300" height="44" rx="22" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="b" x="480" y="103" text-anchor="middle">Signed intent (expires, one lane slot)</text>
  <path class="flow" d="M480 121 V134 M133 134 H827"/>
  <line class="flow" x1="133" y1="134" x2="133" y2="148" marker-end="url(#ah)"/>
  <line class="flow" x1="364" y1="134" x2="364" y2="148" marker-end="url(#ah)"/>
  <line class="flow" x1="595" y1="134" x2="595" y2="148" marker-end="url(#ah)"/>
  <line class="flow" x1="827" y1="134" x2="827" y2="148" marker-end="url(#ah)"/>

  <!-- column heads -->
  <rect x="24" y="150" width="219" height="36" rx="8" fill="#e7f0ff" stroke="#3b82f6"/>
  <text class="col" x="133" y="173" text-anchor="middle">The subject pays</text>
  <rect x="255" y="150" width="219" height="36" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="col" x="364" y="173" text-anchor="middle">The company pays</text>
  <rect x="486" y="150" width="219" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text class="col" x="595" y="173" text-anchor="middle">The payee pays</text>
  <rect x="717" y="150" width="219" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="col" x="826" y="173" text-anchor="middle">A sponsor pays</text>

  <!-- subject -->
  <rect class="card" x="24" y="198" width="219" height="96" rx="8"/>
  <text class="b" x="38" y="221">Self-paid</text>
  <text class="s" x="38" y="241">calls from its own account with</text>
  <text class="s" x="38" y="257">native coins; always possible</text>
  <rect x="38" y="268" width="50" height="18" rx="9" fill="#dafbe1"/><text class="chip" x="63" y="281" text-anchor="middle" fill="#1a7f37">BUILT</text>

  <rect class="card" x="24" y="304" width="219" height="96" rx="8"/>
  <text class="b" x="38" y="327">Fee in the token</text>
  <text class="s" x="38" y="347">percent or fixed, capped at 1 %;</text>
  <text class="s" x="38" y="363">any relayer that submits earns it</text>
  <rect x="38" y="374" width="50" height="18" rx="9" fill="#dafbe1"/><text class="chip" x="63" y="387" text-anchor="middle" fill="#1a7f37">BUILT</text>

  <!-- company -->
  <rect class="card" x="255" y="198" width="219" height="96" rx="8"/>
  <text class="b" x="269" y="221">Company relayer, fee 0</text>
  <text class="s" x="269" y="241">gas is the company's operating</text>
  <text class="s" x="269" y="257">cost; bound to its relayer</text>
  <rect x="269" y="268" width="140" height="18" rx="9" fill="#dafbe1"/><text class="chip" x="339" y="281" text-anchor="middle" fill="#1a7f37">BUILT · portal default</text>

  <rect class="card" x="255" y="304" width="219" height="96" rx="8"/>
  <text class="b" x="269" y="327">Enterprise inbound gateway</text>
  <text class="s" x="269" y="347">partners post signed intents; the</text>
  <text class="s" x="269" y="363">company relays them on its lanes</text>
  <rect x="269" y="374" width="96" height="18" rx="9" fill="#dafbe1"/><text class="chip" x="317" y="387" text-anchor="middle" fill="#1a7f37">BUILT on EVM</text>

  <!-- payee -->
  <rect class="card" x="486" y="198" width="219" height="96" rx="8"/>
  <text class="b" x="500" y="221">Direct settlement</text>
  <text class="s" x="500" y="241">the payee submits the payer's</text>
  <text class="s" x="500" y="257">signature: an expiring e-cheque</text>
  <rect x="500" y="268" width="96" height="18" rx="9" fill="#dafbe1"/><text class="chip" x="548" y="281" text-anchor="middle" fill="#1a7f37">BUILT on EVM</text>

  <rect class="card" x="486" y="304" width="219" height="96" rx="8"/>
  <text class="b" x="500" y="327">Receiver pays the fee</text>
  <text class="s" x="500" y="347">the payee co-signs a fee from its</text>
  <text class="s" x="500" y="363">own balance; one transaction</text>
  <rect x="500" y="374" width="84" height="18" rx="9" fill="#ddf4ff"/><text class="chip" x="542" y="387" text-anchor="middle" fill="#0969da">SPECIFIED</text>

  <!-- sponsor -->
  <rect class="card" x="717" y="198" width="219" height="96" rx="8"/>
  <text class="b" x="731" y="221">Gas sponsorship policy</text>
  <text class="s" x="731" y="241">a node rule books the gas to a</text>
  <text class="s" x="731" y="257">sponsor's account</text>
  <rect x="731" y="268" width="168" height="18" rx="9" fill="#ddf4ff"/><text class="chip" x="815" y="281" text-anchor="middle" fill="#0969da">SPECIFIED · pool PLANNED</text>

  <rect class="card" x="717" y="304" width="219" height="96" rx="8"/>
  <text class="b" x="731" y="327">Sponsored non-token call</text>
  <text class="s" x="731" y="347">a service company relays it and</text>
  <text class="s" x="731" y="363">bills off chain; contract fee NONE</text>
  <rect x="731" y="374" width="84" height="18" rx="9" fill="#ddf4ff"/><text class="chip" x="773" y="387" text-anchor="middle" fill="#0969da">SPECIFIED</text>

  <text class="sub" x="24" y="424">Fee modes NONE, PERCENT, FIXED; a fee is charged only if the call succeeds (all or nothing).</text>
</svg>
