[package]
name = "pqzl-wasm"
version = "0.1.0"
edition = "2021"
license-file = "../../../../LICENSE"
publish = false

# wasm32-unknown-unknown harness for the pqzl crate: the bench steps (pqzl::bench, as pqzl/test/pqz_bench.c's PQZ_WASM
# exports) for run_wasm.mjs. Raw exports, no wasm-bindgen.
[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
pqzl = { path = "..", default-features = false, features = ["sv", "bench"] }

[features]
# the parameter set (owner 2026-10-21: one per build), forwarded to pqzl; exactly one
default = ["set-n2304-kmax4096"]
# BEGIN gen_set.py sets
set-n2048-kmax1024 = ["pqzl/set-n2048-kmax1024"]
set-n2304-kmax4096 = ["pqzl/set-n2304-kmax4096"]
set-n2560-kmax16384 = ["pqzl/set-n2560-kmax16384"]
# END gen_set.py sets

[profile.release]
panic = "abort"
codegen-units = 1

[workspace]
