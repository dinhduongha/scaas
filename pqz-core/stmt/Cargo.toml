[package]
name = "pqz-stmt"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false

# The one PQZ statement codec (P6e plan R2 / D15): statements of both proof systems, pk / ciphertext, bundle, opening,
# precompile input. no_std + alloc, no dependencies; builds for wasm32-unknown-unknown.
[dependencies]

[features]
# the parameter set (owner 2026-10-21: one per build, pqz-core/params/sets/<set>/rust/set.rs): exactly one
default = ["set-n2048-kmax1024"]
# BEGIN gen_set.py sets
set-n2048-kmax1024 = []
set-n2304-kmax4096 = []
set-n2560-kmax16384 = []
# END gen_set.py sets
# bench only (P6-ANON plan, global constraints): op 7 accepts M = 8, 16 for both ids; never in the precompile build
oversize = []

[workspace]
