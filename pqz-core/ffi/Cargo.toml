[package]
name = "pqz-ffi"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false

# The one boundary in front of both PQZ verifiers (P6e plan D10, R5; pq-zether.md §9.1, CTR-PQZ-10): the precompile
# decoder (pqz-stmt), PQZL = the C core (libpqz, built here by build.rs from ../src, ../lazer, ../params with
# build.sh's flags), PQZH = the Ligero crate without its bench feature; the C ABI pqz_precompile (pqz_ffi.h) for P6f;
# the Rust API for the node; feature `prove` (keygen / enc / dec / prove of both systems) for P6h.
[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
pqz-stmt = { path = "../stmt" }
pqzh-ligero = { path = "../pqzh/ligero", default-features = false }
sha3 = "=0.10.8"
# feature `prove` only: the op 7 sender memo (P6-ANON §5.4, CTR-PQZ-23 / CTR-ZTH-50: HKDF-SHA256)
hkdf = { version = "=0.12.4", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[build-dependencies]
cc = "1"

[features]
# prover side for clients (P6h): keygen, enc, dec, prove (PQZL and PQZH), witness layouts, test fixtures, the op 7
# memo
prove = ["dep:hkdf", "dep:sha2"]
# fault-injection and measurement hooks (pqzl::TEST_*, reinit, arena_bytes): tests and the bench only, never in a
# production build
test-hooks = []
# the libFuzzer build (pqz-core/fuzz, plan Task 10 / D12): the C core with ASan + UBSan + sanitizer coverage and
# pqz_rel.c's test hooks (pqz_test_mutate: decode a PQZL proof, change a field, re-encode); no symbol scan (the
# sanitizer runtime is outside the library). Never in a production build.
fuzz = ["test-hooks"]

[[bin]]
name = "pqz-vectors"
path = "src/bin/pqz-vectors.rs"
required-features = ["prove"]

[[example]]
name = "ffi_bench"
required-features = ["prove", "test-hooks"]

[[test]]
name = "ffi"
required-features = ["prove", "test-hooks"]

[[test]]
name = "fault"
required-features = ["prove", "test-hooks"]

[[test]]
name = "verify_only"
required-features = ["prove", "test-hooks"]

[profile.release]
debug = 1
panic = "unwind"

[workspace]
