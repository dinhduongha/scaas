[package]
name = "pqz-ffi"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false

# The one boundary in front of both PQZ verifiers (P6e plan D10, R5; pq-zero-knowledge.md §9.1, CTR-PQZ-10): the precompile
# decoder (pqz-stmt), PQZL = the Rust crate `pqzl` (feature `pqzl-rust`) or the C core (feature `pqzl-c`: libpqz, built
# here by build.rs from ../pqzl/{src,lazer,params} with build.sh's flags), PQZH = the Ligero crate without its bench
# feature; the C ABI pqz_precompile (pqz_ffi.h) for P6f; the Rust API for the node; feature `prove` (keygen / enc /
# dec / prove of both systems) for P6h.
[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
pqz-stmt = { path = "../stmt", default-features = false }
# PQZH: Ligero over the set's F_q (plan 5h Task 8c part 2): feature `pqzh`, implied by `set-<set>` for every set whose
# set.toml says pqzh, which also forwards the set to pqzh-ligero (gen_set.py writes the set lines below)
pqzh-ligero = { path = "../pqzh/ligero", default-features = false, optional = true }
sha3 = "=0.10.8"
# feature `pqzl-rust`: the PQZL core in Rust (pqz-core/pqzl/rust), byte-for-byte equal to the C core. Parameter set
# (owner 2026-10-21: one per build): the feature `set-<set>` below, forwarded to pqz-stmt and pqzl (build.rs compiles
# the C core with the same set)
pqzl = { path = "../pqzl/rust", optional = true, default-features = false, features = ["sv"] }
# feature `prove` only: the op 7 sender memo (P6-ANON §5.4, CTR-PQZ-23 / CTR-ZTH-50: HKDF-SHA256)
hkdf = { version = "=0.12.4", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[build-dependencies]
# feature `pqzl-c` only: build.rs compiles the C core
cc = { version = "1", optional = true }

[features]
# the PQZL backend (CTR-PQZ-09, owner 2026-10-18): the Rust crate by default, no C compiled; the parameter set
# n2304-kmax4096, the default set on chain (owner 2026-10-21; plan 5h Task 8d)
default = ["pqzl-rust", "set-n2304-kmax4096"]
# the parameter set (pqz-core/params/sets/<set>, owner 2026-10-21): exactly one; another set than the default needs
# --no-default-features --features pqzl-rust,set-<set>. Vectors: smartcontracts/vectors/pqz/<set>/
# (n2048-kmax1024: smartcontracts/vectors/pqz/).
# BEGIN gen_set.py sets
set-n2048-kmax1024 = ["pqz-stmt/set-n2048-kmax1024", "pqzl?/set-n2048-kmax1024", "pqzh-ligero?/set-n2048-kmax1024", "pqzh"]
set-n2304-kmax4096 = ["pqz-stmt/set-n2304-kmax4096", "pqzl?/set-n2304-kmax4096", "pqzh-ligero?/set-n2304-kmax4096", "pqzh"]
set-n2560-kmax16384 = ["pqz-stmt/set-n2560-kmax16384", "pqzl?/set-n2560-kmax16384", "pqzh-ligero?/set-n2560-kmax16384", "pqzh"]
# END gen_set.py sets
# PQZH (Ligero) compiled in: every set with pqzh (the set lines above)
pqzh = ["dep:pqzh-ligero"]
# `pqzl::` = the Rust crate `pqzl`; with `pqzl-c` too, the C core is `pqzl::c` (the differential and the fuzz mode
# `pqzl-diff`)
pqzl-rust = ["dep:pqzl"]
# the PQZL C core (build.rs compiles it), opt-in: `--no-default-features --features pqzl-c` makes it the backend of
# `pqzl::` (the reference; run.sh / vectors/run.sh: PQZL=c)
pqzl-c = ["dep:cc"]
# prover side for clients (P6h): keygen, enc, dec, prove (PQZL and PQZH), witness layouts, test fixtures, the op 7
# memo
prove = ["dep:hkdf", "dep:sha2"]
# fault-injection and measurement hooks (pqzl::TEST_*, reinit, arena_bytes): tests and the bench only, never in a
# production build
test-hooks = ["pqzl?/test-hooks"]
# the libFuzzer build (pqz-core/fuzz, plan Task 10 / D12): `pqzl::test_mutate` (decode a PQZL proof, change a field,
# re-encode); with `pqzl-c` the C core with ASan + UBSan + sanitizer coverage and pqz_rel.c's test hooks
# (pqz_test_mutate), no symbol scan (the sanitizer runtime is outside the library). Never in a production build.
fuzz = ["test-hooks"]

[[bin]]
name = "pqz-vectors"
path = "src/bin/pqz-vectors.rs"
required-features = ["prove"]

[[example]]
name = "lh2"
required-features = ["prove"]

[[example]]
name = "ffi_bench"
required-features = ["prove", "test-hooks"]

[[test]]
name = "ffi"
required-features = ["prove", "test-hooks"]

[[test]]
name = "fault"
required-features = ["prove", "test-hooks"]

[[test]]
name = "verify_only"
required-features = ["prove", "test-hooks"]

[profile.release]
debug = 1
panic = "unwind"

[workspace]
