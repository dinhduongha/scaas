[package]
name = "pqz-ffi-wasm"
version = "0.1.0"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

# wasm32-unknown-unknown harness for pqz-ffi's prove feature (P6e Task 7): builds the fixture, proves every form of both
# ids, verifies through the precompile, and prints the same digest lines as the native test `digest_lines`
# (run_wasm.mjs; ../run.sh diffs them). Raw exports, no wasm-bindgen.
[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
pqz-ffi = { path = "..", default-features = false, features = ["prove"] }

# the PQZL backend, forwarded to pqz-ffi (the same default as pqz-ffi's; ../run.sh's PQZL=rust|c picks one alone)
[features]
default = ["pqzl-rust", "set-n2048-kmax1024"]
pqzl-rust = ["pqz-ffi/pqzl-rust"]
pqzl-c = ["pqz-ffi/pqzl-c"]
# the parameter set, forwarded to pqz-ffi (exactly one; ../run.sh: PQZ_SET)
# BEGIN gen_set.py sets
set-n2048-kmax1024 = ["pqz-ffi/set-n2048-kmax1024"]
set-n2304-kmax4096 = ["pqz-ffi/set-n2304-kmax4096"]
# END gen_set.py sets

[profile.release]
panic = "abort"
codegen-units = 1

[workspace]
