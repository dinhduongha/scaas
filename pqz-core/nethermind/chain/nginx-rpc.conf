# P6f D10 / pq-zero-knowledge.md §10 step 5: the follower's RPC only through this proxy. Per-client rate 10 r/s, burst 20,
# at most 8 concurrent requests; beyond that 429. Applied to every JSON-RPC request: nginx cannot read the method
# (eth_call / eth_estimateGas) before its limit phase without njs, so the limit is stricter than D10's, not looser.
limit_req_zone $binary_remote_addr zone=rpc:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
server {
    listen 8545;
    client_max_body_size 2m;
    limit_req zone=rpc burst=20 nodelay;
    limit_conn conn 8;
    limit_req_status 429;
    limit_conn_status 429;
    location / {
        proxy_pass http://10.76.22.11:8545;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
