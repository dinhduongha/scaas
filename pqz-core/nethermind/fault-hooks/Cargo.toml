[package]
name = "pqz-ffi-fault-hooks"
version = "0.1.0"
edition = "2021"
publish = false

# P6f Task 2: the status-4 path through the C# host. pqz-ffi with its test hooks (never in a production build) plus one
# C entry to switch TEST_FAIL_WORKER on; copied to bin/test-hooks/libpqz_ffi.so for the fault child process only.
# Never in the image (build-image.sh scans the image's library for these names).
[lib]
crate-type = ["cdylib"]

[dependencies]
# the set: pqz-ffi's default (n2304-kmax4096) through this crate's default feature; another set:
# --no-default-features --features pqz-ffi/set-<set> (plan 5h Task 8d part 1b)
pqz-ffi = { path = "../../ffi", default-features = false, features = ["pqzl-rust", "test-hooks"] }

[features]
default = ["pqz-ffi/set-n2304-kmax4096"]

[profile.release]
panic = "unwind"

[workspace]
