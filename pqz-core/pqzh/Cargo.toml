[package]
name = "pqzh"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
p3-air = "=0.8.0"
p3-uni-stark = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-field = "=0.8.0"
p3-matrix = "=0.8.0"
p3-fri = "=0.8.0"
p3-keccak = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-commit = "=0.8.0"
p3-challenger = "=0.8.0"
p3-dft = "=0.8.0"
p3-lookup = "=0.8.0"
p3-batch-stark = "=0.8.0"
rand = { version = "=0.10.3", default-features = false, features = ["std_rng"] }
sha3 = "=0.10.8"
postcard = { version = "=1.1.1", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false }

[profile.release]
debug = 1
panic = "unwind"

[workspace]

# release speed with debug assertions on: prove_batch then checks every constraint and lookup of the traces
[profile.checked]
inherits = "release"
debug-assertions = true
