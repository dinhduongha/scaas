[package]
name = "pqzh-ligero-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# wasm32-unknown-unknown module for the PQZH-Ligero bench (run_wasm.mjs); raw C-ABI exports, no wasm-bindgen.
[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
pqzh-ligero = { path = ".." }

[features]
oversize = ["pqzh-ligero/oversize"]
# the parameter set (pqzh-ligero's; none = v3)
set-n2048-kmax1024 = ["pqzh-ligero/set-n2048-kmax1024"]
set-n2304-kmax4096 = ["pqzh-ligero/set-n2304-kmax4096"]
# fallback A of set (a) (pqzh-ligero's `fallback-retry`; never a production build)
fallback-retry = ["pqzh-ligero/fallback-retry"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[workspace]
