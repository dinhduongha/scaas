[package]
name = "pqzh-ligero"
version = "0.1.0"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

# PQZH over Ligero (docs/research/pqzh-ligero.md). sha3 and the statement codec pqz-stmt only (plan R2, D11): no path
# dependency on the Plonky3 crate pqzh.
[dependencies]
sha3 = "=0.10.8"
pqz-stmt = { path = "../../stmt" }

# bench (default on): the reference presets (conjectured, proven without radix 431, Johnson), the parameter model's
# float code (Params::new, soundness, breakdown) and the test client (client.rs: pqz_bench.c's setup, mutations).
# Production users (pqz-ffi, Task 7) depend with default-features = false and get Params::proven() only, no floats.
[features]
default = ["bench"]
# Parameter set (owner 2026-10-21: one per build; pqz-core/params/sets/<set>/{rust/set.rs, pqzh_set.rs}; plan 5h Task
# 8c): at most one `set-<set>`; none = the frozen v3 set n2048-kmax1024 (pqz-ffi, default-features = false, until 8c
# part 2 forwards its set). Forwarded to pqz-stmt (statement lengths).
set-n2048-kmax1024 = ["pqz-stmt/set-n2048-kmax1024"]
# set (a): n 2304, K_MAX 4,096, q = 61,275,424,977,257 (owner 2026-10-21)
set-n2304-kmax4096 = ["pqz-stmt/set-n2304-kmax4096"]
bench = []
# bench only (P6-ANON plan, global constraints): op 7 also at M = 8, 16 (pqz-stmt's `oversize`), proofs above
# MAX_PROOF_PQZH; never in a production build (pqz-ffi refuses pqz-stmt's `oversize`)
oversize = ["pqz-stmt/oversize"]
# test only (review P-B): memcheck client requests for the constant-time check (src/ct.rs, src/bin/ct.rs, runs/ct.sh;
# x86-64); the only feature under which the lib allows `unsafe` (production: forbid(unsafe_code))
ctgrind = ["bench"]

[[bin]]
name = "ligero_bench"
path = "src/bin/ligero_bench.rs"
required-features = ["bench"]

[[bin]]
name = "ligero_export"
path = "src/bin/ligero_export.rs"
required-features = ["bench"]

[[bin]]
name = "ligero_kat"
path = "src/bin/ligero_kat.rs"
required-features = ["bench"]

[[bin]]
name = "spike_retry"
path = "src/bin/spike_retry.rs"
required-features = ["bench"]

[[bin]]
name = "ct"
path = "src/bin/ct.rs"
required-features = ["ctgrind"]

[[example]]
name = "dump_setup"
required-features = ["bench"]

[profile.release]
debug = 1
panic = "unwind"

[workspace]
