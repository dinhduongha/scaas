[package]
name = "pqz-fuzz"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false

# The oracles of the libFuzzer targets (P6e plan Task 10, D12, D15): a staticlib linked by build.sh with
# targets/<target>.c and clang 18's libFuzzer. Built only by build.sh (sancov RUSTFLAGS, feature `fuzz` of pqz-ffi;
# mode `pqzl-diff`: the C core with ASan + UBSan too). See README.md.
[lib]
crate-type = ["staticlib"]

[dependencies]
# the Rust PQZL core, pinned here (default-features off, pqzl-rust on): the production core (CTR-PQZ-09) even if
# pqz-ffi's default feature changes; mode pqzl-diff adds the C core (feature pqzl-diff = pqz-ffi/pqzl-c)
pqz-ffi = { path = "../ffi", default-features = false, features = ["fuzz", "pqzl-rust"] }

[features]
# the parameter set (pqz-core/params/sets/<set>, one per build): the v3 set by default; build.sh: PQZ_SET
default = ["set-n2048-kmax1024"]
# BEGIN gen_set.py sets
set-n2048-kmax1024 = ["pqz-ffi/set-n2048-kmax1024"]
set-n2304-kmax4096 = ["pqz-ffi/set-n2304-kmax4096"]
# END gen_set.py sets
# mode `pqzl-diff` (pqzl-rust plan Task 11; PQZ_FUZZ_MODE=pqzl-diff build.sh): also the C core (ASan + UBSan, pqz-ffi's
# `pqzl::c`), compared with the Rust core on every PQZL input (verdict, pqz_test_mutate bytes)
pqzl-diff = ["pqz-ffi/pqzl-c"]

[profile.release]
debug = 1
# pqz-ffi's catch_unwind boundary needs unwind; the panic hook (src/lib.rs) aborts on any panic instead
panic = "unwind"
# arithmetic overflow and debug_assert! become panics, i.e. findings (as cargo-fuzz does)
overflow-checks = true
debug-assertions = true

[workspace]
