option (b): at least the measured, rounded up to 1,000); 3zh-core group 2 (owner 2026-11-15, TODO 3zg / 3zh): ML-DSA-65 at its calibrated 100,006 (the holder's and the fee UA's verification), the PQZ precompile at the calibrated rows of chain/engine-pqz.json (test/vectors/pqz-gas, gas-inputs.py), pqz-gas proof lengths of the three-key vectors: measured 6,073,179, pinned 6,074,000 (was 7,516,000; the rule of 2026-11-12 option (b))
