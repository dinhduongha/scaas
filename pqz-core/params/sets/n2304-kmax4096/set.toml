# PQZ parameter set n2304-kmax4096: the input of pqz-core/params/sets/gen_set.py (every other file of this set is
# derived from it; README.md beside this directory). The default set: plan 5h Task 7c candidate E.
description = "the default set, owner 2026-10-21 (plan 5h Task 8b)"
n = 2304
k_max = 4096
q = 61275424977257                # 2^45.80, q = 9 mod 16, q - 1 divisible by 2^3 * 19 * 43 * 431
pqz_delta = 1.00366               # e-s1.txt: every spec meets MSIS beta >= 450
kmlwe_min = 36                    # e-s1.txt: hiding MLWE uSVP and dual_hybrid beta >= 450
pqzh = true                       # PQZH (Ligero over this q) is built for this set
max_input = 524288                # pqz-stmt MAX_INPUT 512 KiB (decisions 2026-10-20 O8, 2026-10-21 (7); the node's in 8d)

[pqzh_preset]                     # PQZH's Ligero preset: gen_set.py writes pqzh_set.rs (+ q - 1's factors, generator, non-square)
description = "preset B (owner 2026-10-22), the radices 7 and 17 of this q - 1, so that every debit proof bound is below MAX_PROOF_PQZH (THE preset's were 263,784-265,236 B; fallbacks in ./pqzh_set_fallback.rs, docs/research/pqzh-set-a-proof-limit.md); t = 120 is one above the preset search's minimum 119, so the total soundness stays above THE preset's 127.23 bits"
radices = [2, 7, 17, 19, 43, 431] # FFT radices, each dividing q - 1
n = 45752                         # code length (on the coset 3 H_n)
k = 952                           # message length (H_k)
t = 120                           # column queries
max_proof = 262144                # MAX_PROOF_PQZH (B): the precompile's and the prover's proof limit

[approval]
date = "2026-10-21"
what = "supersedes n2560-kmax16384 as the approved set (owner, progress.md 2026-10-21); the default set of the pqzl crate"
