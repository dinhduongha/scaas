# PQZ parameter set n2304-kmax4096: the input of pqz-core/params/sets/gen_set.py (every other file of this set is
# derived from it; README.md beside this directory). The default set: plan 5h Task 7c candidate E.
description = "the default set, owner 2026-10-21 (plan 5h Task 8b)"
n = 2304
k_max = 4096
q = 61275424977257                # 2^45.80, q = 9 mod 16, q - 1 divisible by 2^3 * 19 * 43 * 431
pqz_delta = 1.00366               # e-s1.txt: every spec meets MSIS beta >= 450
s_aud = 3                         # legs per randomness group of an audited R_TXM (owner 2026-10-25, R0-1 direction 2: the hint study
                                  # pqzl/params/anon/hints-s.txt, 32 s_aud worst-case hints); without the auditor groups of 4
kmlwe_min = 36                    # e-s1.txt: hiding MLWE uSVP and dual_hybrid beta >= 450
pqzh = true                       # PQZH (Ligero over this q) is built for this set
pqzh_value = false                # no PQZH value token (init refuses PQZH_ID; registration and disclosure only): no PQZH debit fits one transaction under EIP-7976 (C2-1; owner 2026-10-27)
max_input = 524288                # pqz-stmt MAX_INPUT 512 KiB (decisions 2026-10-20 O8, 2026-10-21 (7); the node reads it, pqz_max_input())
roll_max = 80                     # the contracts' ROLL_MAX (PqzSet.ROLL_MAX; plan 5h Task 8d part 2b, controller proposal, owner may override): the largest multiple of 16 under 0.75 * 2^24 on both relay paths: relayed full rollover 12,111,158 (mtxExecute) / 12,268,273 (uaExecute, ML-DSA-65 fee UA) gas, 96: 13,382,390 / 13,539,505 > 0.75 * 2^24 (smartcontracts/evm/runs/2026-10-26-t8d2b-fix-rollscan-n2304-kmax4096.txt)
debit_min_gas = 6991487            # PqzSet.PQZ_DEBIT_MIN_GAS (review2 T2, C0-5; controller proposal, owner may override): the cheapest built PQZL debit form, burn 1 to an address, full relayed transaction on the costlier relay path (uaExecute, ML-DSA-65 fee UA at 68,006 [estimate]) regular gas; the UA registry bounds a PQZ holder's worst-case authorization + this <= 2^24 (smartcontracts/evm/runs/2026-10-26-t8d2b-fix-gas-n2304-kmax4096.txt:250-251)
pqzl_id = "scaas/pqz/lnp22/mlwe-d64k36-q46l4/v5"   # PQZL proofSystemId = keccak256(label) (R0 review fix 2026-10-25: R0-1 auditor windows, R0-C2 Bprime, R0-C3 challenge filter; v4 retired)
pqzh_id = "scaas/pqz/pqzh/ligero-fq46-n45752k952t120-keccak256-zk-proven/v3"   # PQZH proofSystemId (the same bump, R0-1 auditor windows; v2 retired; field and [pqzh_preset] named)

[pqzh_preset]                     # PQZH's Ligero preset: gen_set.py writes pqzh_set.rs (+ q - 1's factors, generator, non-square)
description = "preset B (owner 2026-10-22), the radices 7 and 17 of this q - 1, so that every debit proof bound is below MAX_PROOF_PQZH (THE preset's were 263,784-265,236 B; fallbacks in ./pqzh_set_fallback.rs, docs/research/pqzh-set-a-proof-limit.md); t = 120 is one above the preset search's minimum 119, so the total soundness stays above THE preset's 127.23 bits"
radices = [2, 7, 17, 19, 43, 431] # FFT radices, each dividing q - 1
n = 45752                         # code length (on the coset 3 H_n)
k = 952                           # message length (H_k)
t = 120                           # column queries
max_proof = 327680                # MAX_PROOF_PQZH (B), 320 KiB (owner 2026-10-25, as n2560-kmax16384: R0-1 audited R_TXM M = 4 with G = 2 above 262,144)

[pqzl_c]                          # pqz-ffi's opt-in C backend (feature pqzl-c; review R1-C2 / R4-C1): sized from the gate's
                                  # C peaks with every relation loaded (runs/gate/<set>-fnv-c.jsonl, x 1.5; README.md beside this dir)
prove_arena_mib = 2304             # native prover / generic-verifier arena (ARENA_BIG)
wasm_max_legs = 2                 # the largest op 7 M the C backend proves in wasm32 (its 512 MiB arena); measured (plan 5h Task 8d part 2b): C wasm32 arena peak at M = 2 356.7 MiB with every wallet relation loaded, margin 1.44x (pqzl/runs/2026-10-26-t8d2b-cwasm-m2-n2304-kmax4096.jsonl)

[approval]
date = "2026-10-21"
what = "supersedes n2560-kmax16384 as the approved set (owner, progress.md 2026-10-21); the default set of the pqzl crate"
