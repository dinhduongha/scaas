[package]
name = "pqz-vectors"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
publish = false

# The P6e Task 11 vector generator (plan R4, D9, D13): writes every file of smartcontracts/vectors/pqz/ (read in
# place, no copies) from the C core (libpqz.a of ../build.sh: keys, encryption, PQZL proofs and both verifiers) and
# the Ligero crate (PQZH proofs and verifier); `--check` regenerates in memory and compares byte for byte.
[dependencies]
pqz-stmt = { path = "../stmt" }
pqzh-ligero = { path = "../pqzh/ligero", default-features = false }
sha3 = "=0.10.8"

[profile.release]
debug = 1

[workspace]
