[package]
name = "relay_target"
version = "0.1.0"
edition = "2021"
publish = false
description = "TEST ONLY (metatx split T11): the target of scaas::relay_fee tests; loaded only by LiteSVM, never deployed"

[lib]
crate-type = ["cdylib", "lib"]

[features]
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
