[package]
name = "bamboo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bamboo meta-transaction program: SubjectAccount PDA, lanes, mandates, DEX settlement (S12)"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
solana-instructions-sysvar = "=3.0.1"
solana-sha256-hasher = "=3.1.0"

[dev-dependencies]
litesvm = { version = "=0.17.0", features = ["precompiles"] }
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-message = "4"
solana-account = "4"
solana-clock = "3"
solana-system-interface = { version = "3", features = ["bincode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
