[workspace]
resolver = "3"
members = ["contracts/*"]

[workspace.package]
rust-version = "1.91"

[workspace.dependencies]
soroban-sdk = "26.1.1"
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
