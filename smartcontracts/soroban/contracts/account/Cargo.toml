[package]
name = "scaas-account"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
scaas-token = { path = "../token" }
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
scaas-dex = { path = "../dex" }
