[package]
name = "scaas-mandate"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
scaas-ua-common = { path = "../ua-common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
scaas-token = { path = "../token" }
scaas-ua-registry = { path = "../ua-registry" }
serde_json = { workspace = true }
ed25519-dalek = "2"
