[package]
name = "scaas-relay-fee"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
scaas-token = { path = "../token" }
scaas-mandate = { path = "../mandate" }
