[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# storageLayout in the artifacts: `test/v2/Layout.t.sol` pins it against `test/v2/layout/*.json` (TW2 §10.1).
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read-write", path = "./test/vectors" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/v2/layout" },
  { access = "read", path = "./out" },
]

[invariant]
runs = 64
depth = 32
fail_on_revert = true

# Chain 9000 (Nethermind 1.39.0, private, Clique một signer) — Fusaka + BPO2.
# [2026-08-31] Trước đây profile này phải là "berlin": genesis khai fork kiểu Geth mà
# Nethermind bỏ qua im lặng, nên chain chạy pre-London — không PUSH0, không TSTORE,
# không EIP-2537. Đã sửa chainspec và đo lại: PUSH0/TLOAD/MCOPY/BASEFEE/CLZ đều sống,
# cả 7 precompile BLS12-381 trả đúng số byte, base fee dính 0 nên gas vẫn miễn phí.
# Chi tiết: /home/dockers/mba-chain-nethermind/README-chainspec.md
[profile.private9000]
evm_version = "prague"

# Zether (S2): BLS12-381 cần EIP-2537 ⇒ Prague. forge 1.3.5 mặc định đã là prague (test BLS chạy thẳng
# trên EVM của forge); profile ghim lại để không trôi khi forge đổi mặc định.
#   FOUNDRY_PROFILE=zether forge test --match-path 'test/zether/*'
[profile.zether]
evm_version = "prague"

[profile.gnosis]
evm_version = "cancun"

[profile.celo]
evm_version = "cancun"
