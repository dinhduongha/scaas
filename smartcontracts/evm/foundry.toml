[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_remappings = false # only the remappings below: an installed lib's own lib/ (OZ erc4626-tests, halmos) would enter the metadata and move every CREATE2 address (KATs)
test = "test"
solc_version = "0.8.37"
# Amsterdam (Glamsterdam) for every profile (owner 2026-10-21, NET-EVM-06): every chain that runs these contracts must
# have it, and the SCaaS testnet has it from block 1 (Nethermind 2.2.0). A public chain is deployed only after its fork.
# Foundry 1.8.5 needs `experimental` for it. No `block.slotnum` (EIP-7843): Clique has no slot.
evm_version = "amsterdam"
experimental = true
# Foundry 1.8.5 isolates by default: each top-level call of a test is its own transaction (intrinsic gas, EIP-7976 calldata
# floor, EIP-8037 state gas apart; `vm.lastCallGas`), as `test/pqz/PqzStateGas.t.sol` measures. Pinned here, so a Foundry
# default change cannot move the gas bounds.
isolate = true
# 2^33 (Foundry's default is 2^30): the heavy vector tests (Ligero, FN-DSA, FROST, PQZ) run many isolated calls, each paying
# its cold accesses again, at Amsterdam's prices; 2^30 left four of them out of gas (Task F185).
gas_limit = 8_589_934_592
# `new C(...)` of a src contract in a test stays a real CREATE. Foundry 1.8.5 turns dynamic test linking on by default: it
# rewrites such a `new` into `vm.deployCode`, whose constructor revert after `vm.expectRevert` ends the test frame itself
# and passes as the expected revert, so nothing after it runs (audit 2026-11-04: 31 sites in 14 tests; reproducer and
# canary `test/ExpectRevertLint.t.sol`, which also refuses an explicit `vm.deployCode` after `expectRevert`).
dynamic_test_linking = false
optimizer = true
optimizer_runs = 200
via_ir = false
# No metadata hash in the bytecode (owner 2026-11-17, code-format plan F2): a comment, NatSpec or format edit moves no
# code hash, initcode hash or CREATE2 / CREATE3 address; each contract is smaller; builds reproduce across hosts.
# The CBOR tail keeps the solc version. Every profile below states it again.
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
# storageLayout in the artifacts: `test/v2/Layout.t.sol` pins it against `test/v2/layout/*.json` (TW2 §10.1).
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read-write", path = "./test/vectors" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/v2/layout" },
  { access = "read", path = "./out" },
  { access = "read", path = "./src" },
  { access = "read", path = "../vectors" },
  { access = "read-write", path = "../vectors/metatx" },
  { access = "read-write", path = "../vectors/governance" },
  { access = "read-write", path = "../vectors/pqz" },          # test/pqz/PqzStateVectors.t.sol (STATE_VECTORS=1)
  { access = "read-write", path = "../vectors/zether" },       # test/zether/ZetherStateVectors.t.sol (STATE_VECTORS=1)
  { access = "read-write", path = "../vectors/factory" },      # test/v2/Create3Kat.t.sol (WRITE_CREATE3_KAT=true)
  { access = "read", path = "./size-baseline.json" },
  { access = "read", path = "./broadcast" },                   # script/ZetherE2E.s.sol gasSplit (the e2e broadcast)
  { access = "read", path = "./test" },                        # test/ExpectRevertLint.t.sol scans the tests
  { access = "read", path = "./chain-uids.json" },             # script/DeployBase.sol _setup (chain-neutral spec §3.3)
  { access = "read", path = "./rescue-vault-admin-log.json" }, # script/DeployRescueVault.s.sol, the public admin log
  { access = "read", path = "./rescue-vault-init.hex" },       # script/DeployRescueVault.s.sol, the vault's committed init code
  { access = "read-write", path = "./releases.json" },         # script/DeployBase.sol, the release list (spec §6.2)
]

# forge fmt (owner 2026-11-17: width 120 for every language but Rust); the other options keep forge's defaults. The
# generated PqzSet.sol (pqz-core/params/sets/gen_set.py) is never hand-edited, so never formatted.
[fmt]
line_length = 120
ignore = ["src/pqz/PqzSet.sol"]

[invariant]
runs = 64
depth = 32
fail_on_revert = true

# Chain 7622, formerly 9000 (private, Clique một signer): Nethermind 2.2.0 with Amsterdam from block 1 (was 1.39.0 with Fusaka + BPO2).
# [2026-08-31] Trước đây profile này phải là "berlin": genesis khai fork kiểu Geth mà
# Nethermind bỏ qua im lặng, nên chain chạy pre-London — không PUSH0, không TSTORE,
# không EIP-2537. Đã sửa chainspec và đo lại: PUSH0/TLOAD/MCOPY/BASEFEE/CLZ đều sống,
# cả 7 precompile BLS12-381 trả đúng số byte, base fee dính 0 nên gas vẫn miễn phí.
# Chi tiết: ~dockers/mba-chain-nethermind/README-chainspec.md
[profile.scaas-testnet]
bytecode_hash = "none"
evm_version = "amsterdam"

# Zether (S2): BLS12-381 cần EIP-2537 (Prague trở lên); profile ghim Amsterdam như default.
#   FOUNDRY_PROFILE=zether forge test --match-path 'test/zether/*'
[profile.zether]
bytecode_hash = "none"
evm_version = "amsterdam"

# Gnosis Chain: Pectra since 2025-04-30 14:03:40 UTC, then Fusaka (EIP-2537 measured live, docs/networks/evm.md §3); deploy after its Glamsterdam fork.
[profile.gnosis]
bytecode_hash = "none"
evm_version = "amsterdam"

[profile.celo]
bytecode_hash = "none"
evm_version = "amsterdam"

# Draft chains (docs/networks/evm.md §1, researched 2026-10-11): BSC through Mendel (Osaka) 2026-04-28; Polygon PoS has
# no named Osaka fork but runs the Osaka opcode set (CLZ since Lisovo 2026-03-04); Base through Azul 2026-05-28; each is
# deployed after its Glamsterdam fork.
[profile.bsc]
bytecode_hash = "none"
evm_version = "amsterdam"

[profile.polygon]
bytecode_hash = "none"
evm_version = "amsterdam"

[profile.base]
bytecode_hash = "none"
evm_version = "amsterdam"
