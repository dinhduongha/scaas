[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.37"
# Fusaka (Osaka EVM) for every chain (owner 2026-10-11): 7622, Gnosis, Celo and the draft BSC/Polygon/Base.
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# storageLayout in the artifacts: `test/v2/Layout.t.sol` pins it against `test/v2/layout/*.json` (TW2 §10.1).
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read-write", path = "./test/vectors" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/v2/layout" },
  { access = "read", path = "./out" },
  { access = "read", path = "./src" },
]

[invariant]
runs = 64
depth = 32
fail_on_revert = true

# Chain 7622, formerly 9000 (Nethermind 1.39.0, private, Clique một signer) — Fusaka + BPO2.
# [2026-08-31] Trước đây profile này phải là "berlin": genesis khai fork kiểu Geth mà
# Nethermind bỏ qua im lặng, nên chain chạy pre-London — không PUSH0, không TSTORE,
# không EIP-2537. Đã sửa chainspec và đo lại: PUSH0/TLOAD/MCOPY/BASEFEE/CLZ đều sống,
# cả 7 precompile BLS12-381 trả đúng số byte, base fee dính 0 nên gas vẫn miễn phí.
# Chi tiết: /home/dockers/mba-chain-nethermind/README-chainspec.md
[profile.private7622]
evm_version = "osaka"

# Zether (S2): BLS12-381 cần EIP-2537 (Prague trở lên); profile ghim Osaka như default.
#   FOUNDRY_PROFILE=zether forge test --match-path 'test/zether/*'
[profile.zether]
evm_version = "osaka"

# Gnosis Chain: Pectra since 2025-04-30 14:03:40 UTC, then Fusaka (EIP-2537 measured live, docs/networks/evm.md §3).
[profile.gnosis]
evm_version = "osaka"

[profile.celo]
evm_version = "osaka"

# Draft chains (docs/networks/evm.md §1, researched 2026-10-11): BSC through Mendel (Osaka) 2026-04-28; Polygon PoS has
# no named Osaka fork but runs the Osaka opcode set (CLZ since Lisovo 2026-03-04); Base through Azul 2026-05-28.
[profile.bsc]
evm_version = "osaka"

[profile.polygon]
evm_version = "osaka"

[profile.base]
evm_version = "osaka"
