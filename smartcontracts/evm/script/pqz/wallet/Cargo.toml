[package]
name = "pqz-wallet-sim"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../../../../LICENSE"
description = "The matrix's wallet for opening tokens (three-key round, spec §15.2): ua-rs's PqzKeyHandle gates every use of the PQZ secret; pqz-ffi does the arithmetic. Test tool, UNAUDITED."

# Its own workspace: a matrix tool, never linked into a product. The holder side runs through ua-rs `pqz3k::PqzKeyHandle`
# (check -> acceptance, open_debit, marks) so the matrix exercises the client rule "no bare class-2 decrypt"; the
# sender side and the auditor tool call pqz-ffi's opening module (no PQZ secret there).
[dependencies]
# the release build of scaas-ua (owner 2026-11-17, option (b): no `vectors`, scripts/check_test_features.py): the handle through
# `Wallet::from_mnemonic` + `Wallet::pqz_scoped_key`, the shipped API
scaas-ua = { path = "../../../../../clients/ua-rs" }
# the test wallets' mnemonic from their entropy, and the auditor tool's BIP-39 seed (the pin of scaas-ua)
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc"] }
pqz-ffi = { path = "../../../../../pqz-core/ffi", features = ["prove"] }
serde_json = "=1.0.145"

[workspace]
