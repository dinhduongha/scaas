[workspace]
members = ["metaop", "token", "mandate", "dex", "relayfee", "relayexec", "tests"]
resolver = "2"

[workspace.dependencies]
cosmwasm-std = { version = "3.0", features = ["cosmwasm_2_1"] }
cw-storage-plus = "3.0"
serde = { version = "1", default-features = false, features = ["derive"] }
sha2 = "0.10"
# Keccak-256 for CTR-MTX-26 / -27 (`cosmwasm-std` has none; controller call, spec §6.2).
sha3 = "0.10"
ripemd = "0.1"
scaas-metaop = { path = "metaop" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
debug-assertions = false
