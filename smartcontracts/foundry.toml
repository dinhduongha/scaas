[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read-write", path = "./test/vectors" },
  { access = "read-write", path = "./deployments" },
]

[invariant]
runs = 64
depth = 32
fail_on_revert = true

# Chain 9000 (Nethermind 1.39.0, private, Clique một signer) — Fusaka + BPO2.
# [2026-08-31] Trước đây profile này phải là "berlin": genesis khai fork kiểu Geth mà
# Nethermind bỏ qua im lặng, nên chain chạy pre-London — không PUSH0, không TSTORE,
# không EIP-2537. Đã sửa chainspec và đo lại: PUSH0/TLOAD/MCOPY/BASEFEE/CLZ đều sống,
# cả 7 precompile BLS12-381 trả đúng số byte, base fee dính 0 nên gas vẫn miễn phí.
# Chi tiết: /home/dockers/mba-chain-nethermind/README-chainspec.md
[profile.private9000]
evm_version = "prague"

[profile.gnosis]
evm_version = "cancun"

[profile.celo]
evm_version = "cancun"
