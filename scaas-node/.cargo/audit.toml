# cargo-audit of scaas-node: the vulnerabilities deny.toml ignores, with the same reasons, and one cargo audit alone sees.
[advisories]
ignore = [
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.5 via alloy 1.6 (k256 0.13; alloy 2.6.1 too, crates.io 2026-11-28); the node's own BIP-32 is on k256 0.14; review by 2027-02-28 (deny.toml)
  "RUSTSEC-2026-0459", # libsqlite3-sys 0.30.1: SQLite WAL page-size bug; fix needs sqlx 0.9.1, remove from 2026-12-02 (deny.toml)
  # rsa 0.9.10 (Marvin; fixed in rsa 0.10.0, 2026-11-08): in Cargo.lock only, through sqlx's optional sqlx-mysql 0.8.6, which
  # pins rsa ^0.9 and which cargo locks for sqlx's weak `sqlx-mysql?/...` features although the node enables no `mysql`
  # feature; it is never built (`cargo tree -i rsa --target all -e all` prints nothing, so cargo deny, which reads the
  # feature graph, does not see it). sqlx-mysql 0.9.1 takes rsa ^0.10: remove from 2026-12-02 with the move to sqlx 0.9.1
  # (with RUSTSEC-2026-0459), and in any case before the node enables MySQL (docs/node/store.md#NODE-STO-06).
  "RUSTSEC-2023-0071",
]
