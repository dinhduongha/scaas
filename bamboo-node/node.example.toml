# bamboo-node --config node.toml
# Secrets are NEVER in this file: only the names of the environment variables that hold them.

[odoo]
url = "http://odoo:8069"
database = "odoo19"
relay_api_key_env = "BAMBOO_RELAY_API_KEY"       # user in "Blockchain Relay Worker (service)"
indexer_api_key_env = "BAMBOO_INDEXER_API_KEY"   # user in "Blockchain Indexer (service)"

[modules]
submit = true
indexer = true
gateway = true
gateway_bind = "127.0.0.1:8547"                  # behind a reverse proxy (per-IP rate limit there)

[[chains]]
evm_chain_number = 9000
rpc_urls = ["http://nethermind:8545"]            # >= finality.quorum independent endpoints
signer_key_env = "BAMBOO_RELAYER_KEY_9000"       # outer-tx key: holds gas only, never user funds
finality = { mode = "depth", depth = 1, quorum = 1 }
# dex = "0x..."                                  # OrderBookDex ("order_book_dex" in smartcontracts/deployments/9000.json)
poll_ms = 1000
stuck_after_secs = 60
max_gas_per_tx = 3000000
max_fee_cap_gwei = 500
