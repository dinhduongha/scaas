[workspace]
resolver = "3"
members = ["contracts/*"]

[workspace.package]
rust-version = "1.90"

[workspace.dependencies]
soroban-sdk = "25.3.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
