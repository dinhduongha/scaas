[package]
name = "zether-prover"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Zether client: R33 conf keys, lifted ElGamal, Sigma + Bulletproofs prover/verifier (bn254, BLS12-381), WASM. UNAUDITED - NOT FOR PRODUCTION FUNDS."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zether-cli"
path = "src/bin/zether-cli.rs"

[dependencies]
ark-ff = "0.5"
ark-ec = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
ark-bn254 = "0.5"
ark-bls12-381 = "0.5"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hkdf = "0.12"
bip39 = { version = "2", default-features = false, features = ["std", "unicode-normalization"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
zeroize = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
bip32 = { version = "0.5", features = ["secp256k1"] }

# arkworks in an unoptimised build makes the 2^40 BSGS test and the 64-bit range proofs crawl.
[profile.dev]
opt-level = 2
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
