[package]
name = "scaas-profile"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
license-file = "../../LICENSE"
description = "SCaaS user profiles' local store (CLI-UPR-02): the sealed store of one profile over scaas-ua's profile arena; no SDK. UNAUDITED."

# Owner 2026-11-27 (decisions CLI-UPR-02's Change): the profile store is its own crate, so an app's build without the SDK holds a
# profile; the SDK (feature `user-profile`) depends on it. Every KDF, AEAD and MAC runs in `scaas-ua`'s profile arena
# (`ProfileKeys`); this crate holds handles, public bytes and files.
[features]
default = []
# user-profiles spec §7.5: the test KDF set (scaas-ua's) and the store's test hooks; refused in a release build
# (`compile_error!` without `debug_assertions`; scripts/check_test_features.py)
test-hooks = ["scaas-ua/test-hooks"]

[dependencies]
# default-features = false: scaas-ua's defaults carry the Zether and PQZ facades; `user-profile` is the profile arena with no
# signing code (owner 2026-11-27, user-profiles O15; clients/ua-rs/runs/2026-11-27-key-handles-nm.py checks it), `json` the
# bounded-depth scan of every JSON this crate parses (`scaas_ua::json::depth_within`; it came with `wallet` before)
scaas-ua = { path = "../ua-rs", default-features = false, features = ["user-profile", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# base64 (an encoding) for the sealed items (plan pinned format 6); zeroize the plaintexts, the pin of scaas-ua
base64 = "0.22"
zeroize = "=1.9.1"
# the profile id (spec §4): UUIDv7 by `Builder::from_unix_timestamp_millis` (no feature), its 10 random bytes and the Matrix store
# key's from the OS RNG (getrandom, the one `scaas-ua`'s `OsRng` draws from); `name_key` and the name check (NFKC / NFC), the
# pin of scaas-ua
uuid = { version = "=1.23.0", default-features = false }
getrandom = "=0.2.17"
unicode-normalization = "=0.1.26"

# the Argon2id and AEAD code crawls unoptimised: dependencies at opt-level 3, as the SDK
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
