[package]
name = "scaas-ua"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "SCaaS Universal Account identity layer: kind table, ids, keyHash, ua_msg, popDigest, UAAuth, key-data validation. UNAUDITED."

[dependencies]
sha3 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "schnorr"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
sha2 = "=0.10.9"
curve25519-dalek = "4"
ark-ff = "0.5"
ark-ec = "0.5"
ark-bn254 = "0.5"
ark-bls12-381 = "0.5"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

# arkworks subgroup checks crawl unoptimised
[profile.dev.package."*"]
opt-level = 3
