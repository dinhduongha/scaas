# Config for include/scaas_ua.h. Regenerate with `SCAAS_UA_C_BLESS=1 cargo test --locked --test header`.
language = "C"
cpp_compat = true
include_guard = "SCAAS_UA_H"
usize_is_size_t = true
style = "type"
header = """
// SPDX-License-Identifier: LicenseRef-Vegan-Community-1.0
// Generated by cbindgen 0.28.0 from src/lib.rs, do not edit.
//
// C ABI over the Rust crate scaas-ua (UNAUDITED).
// - Fallible calls return a ScaasUaStatus; scaas_ua_last_error() gives the detail, per thread.
// - The caller owns every buffer; no allocation crosses the ABI and nothing is freed. A fixed-size pointer argument
//   (`out32`, `ua32`, `registry20`, ...) points to that many bytes. A variable output takes (out, size_t *out_len):
//   *out_len is the capacity on entry and the size written on return. When it is too small the call returns
//   SCAAS_UA_ERR_BUFFER and sets *out_len to the size needed, so out = NULL with *out_len = 0 asks for the size.
//   Strings are written NUL-terminated and *out_len counts the NUL.
// - Every function is reentrant and safe to call from any thread: pure computation over immutable static tables.
//   The kind-table strings are initialised once, and the last-error detail is per thread."""
