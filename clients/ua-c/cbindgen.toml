# Config for include/scaas_ua.h. Regenerate with `SCAAS_UA_C_BLESS=1 cargo test --locked --test header`.
language = "C"
cpp_compat = true
include_guard = "SCAAS_UA_H"
usize_is_size_t = true
style = "type"
header = """
// SPDX-License-Identifier: LicenseRef-Vegan-Community-1.0
// Generated by cbindgen 0.28.0 from src/lib.rs, do not edit.
//
// C ABI over the Rust crate scaas-ua (UNAUDITED), ABI version 6 (scaas_ua_abi_version(); scaas_ua_features() says what the
// build holds: a binding checks both at load and refuses a mismatch).
// - Fallible calls return a ScaasUaStatus; scaas_ua_last_error() gives the detail, per thread. No detail repeats an argument
//   (not a mnemonic word, a passphrase, a vault label or a typed-data value).
// - The caller owns every buffer. A fixed-size pointer argument (`out32`, `ua32`, `registry20`, ...) points to that many bytes.
//   A variable output takes (out, size_t *out_len): *out_len is the capacity on entry and the size written on return. When it is
//   too small the call returns SCAAS_UA_ERR_BUFFER and sets *out_len to the size needed, so out = NULL with *out_len = 0 asks for
//   the size. A size query runs the call (a signature, seal or vault is made again; scaas_ua_wallet_backup_seal raises the
//   generation each time), except where the call says its capacity is checked first. Strings are written NUL-terminated and
//   *out_len counts the NUL.
// - Handles (ScaasUaWallet, ScaasUaKey, ScaasUaKemKey, ScaasUaLinkSession, ScaasUaSeedBackup, ScaasUaZetherKey) are the only Rust
//   allocations that cross the ABI. The caller frees each handle it received exactly once with its _free; _free(NULL) is a no-op; _free zeroizes
//   what the handle holds. There is no reference count: use after free, a double free, or freeing a handle while a call on it
//   runs is undefined.
// - Every call may run on any thread, and a handle may be used from any thread concurrently; the last-error detail is per thread.
// - Wallet and child handles: a key, KEM, session or facade (Zether) handle refers to its wallet's secret store, not into the
//   wallet handle.
//   scaas_ua_wallet_lock and scaas_ua_wallet_free wait for calls in flight, wipe the store and revoke every child handle, which
//   then returns SCAAS_UA_ERR_KEY_REVOKED (scaas_ua_wallet_unlock does not revive it) until the caller frees it;
//   freeing the wallet before its children is defined.
// - Caller memory: the mnemonic, both passphrases, the PRF secret, an imported key, a shared secret (ss32), an opened plaintext,
//   a revealed phrase and taken entropy live in caller memory that Rust cannot wipe: the caller zeroizes them after use
//   (explicit_bzero, SecureZeroMemory).
// - Seal / open: a seal authenticates no sender (anyone can seal to any key; a backup or link container carries its sender's
//   signature and opens only against the caller's expect_json), and open / open_container give no replay protection (a valid
//   seal opens again; a link session opens once, a restore compares backup generations).
// - Every export runs inside catch_unwind (the library keeps panic = "unwind"): a panic is SCAAS_UA_ERR_INTERNAL, never an
//   unwind into C."""
