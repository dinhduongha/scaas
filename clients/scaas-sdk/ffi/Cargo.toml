# SPDX-License-Identifier: LicenseRef-Vegan-Community-1.0
# The SDK's reference library for its own binding tests (spec §16.2): a staticlib + cdylib with the generated FRB surface
# (src/api, src/frb_generated.rs) and the two secret copy calls. An app links its own one library instead (scaas-app:
# app-core-rust). UNAUDITED.
[package]
name = "scaas-sdk-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
license-file = "../../../LICENSE"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
scaas-sdk = { path = "..", features = [
  "frb",
  "zether",
  "pqz",
  "pqz-set-n2304-kmax4096",
  "dex",
  "admin",
  "native-networks",
  "classical-roots",
] }
scaas-ua = { path = "../../ua-rs", default-features = false, features = ["wallet"] }
scaas-rpc = { path = "../../scaas-rpc", default-features = false, features = ["evm", "node-client"] }
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1", features = ["rt", "time"] }
# the SDK's records holding a JSON value (an opaque handle across the binding)
serde_json = "1"
# the UniFFI surface (plan T20b-T20h): the SDK's pin, for the test hook of src/hook.rs
uniffi = { version = "=0.31.0", optional = true }

# the SDK's UniFFI surface in this library (spec §16.1): `uniffi` the async API, `sync-api` the sync one (C++)
[features]
uniffi = ["dep:uniffi", "scaas-sdk/uniffi"]
sync-api = ["uniffi", "scaas-sdk/sync-api"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# arkworks subgroup checks crawl unoptimised
[profile.dev.package."*"]
opt-level = 3
