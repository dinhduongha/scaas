name: scaas_sdk
description: Dart binding (flutter_rust_bridge 2) of the SCaaS SDK, generated from its one API (spec §16). UNAUDITED.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter_rust_bridge: 2.13.0
  ffi: ^2.1.3
  meta: ^1.15.0
  # the generated data-carrying enums (KeyRef, Event, OpState, …) are freezed sealed classes (plan T20)
  freezed_annotation: ^3.1.0

dev_dependencies:
  test: 1.25.15
  build_runner: ^2.4.15
  freezed: ^3.2.3
