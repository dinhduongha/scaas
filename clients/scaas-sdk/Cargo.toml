required-features = ["admin"]

[lints.rust]
# `frb_expand`: flutter_rust_bridge_codegen's scan (`frb_hint!`, src/lib.rs)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
