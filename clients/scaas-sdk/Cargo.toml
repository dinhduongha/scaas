[package]
name = "scaas-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
license-file = "../../LICENSE"
description = "SCaaS SDK: the one API apps call (CLI-SDK-01). Signs only through scaas-ua, talks only through scaas-rpc; no cryptography of its own. UNAUDITED."

# docs/clients/scaas-sdk.md (CLI-SDK-*), spec docs/superpowers/specs/2026-11-17-scaas-sdk.md §3.2, §3.3. Each feature's bit is
# the table's (`Sdk::features`, src/lib.rs): appended only, never reused (bit 12, the withdrawn `chat`, stays unused).
[features]
default = ["vault", "account", "wallet", "evm", "file-store", "mlock"]
# plan T42 (CLI-SDK-33 (31), (37)): each family feature enables exactly its `scaas-ua` `fam-<row>`; EVM (with Hedera's EVM side) is
# `evm`'s; `vault` keeps the native keys spec §8.5 has in every build (the `scaas-ua` networks outside
# `native-networks`), so it enables their rows
vault = [
  "scaas-ua/wallet",
  "scaas-ua/fam-evm",
  "scaas-ua/fam-hedera",
  "scaas-ua/fam-cosmos",
  "scaas-ua/fam-sui",
  "scaas-ua/fam-soroban",
  "scaas-ua/fam-ton",
  "scaas-ua/fam-aptos",
  "scaas-ua/fam-solana",
]
# T41.evm step 0 (owner 2026-11-22, decisions CLI-SDK-32): `account` and `wallet` carry no chain code of their own (the rows,
# the native keys, the non-EVM families' reads); every EVM call (alloy's providers, network, rpc-types, the operations, the
# registry, the restore scan) is `evm`'s, which needs `wallet`. Without it an EVM profile is `FeatureMissing` at `Sdk::open`
account = ["vault"]
wallet = ["vault"]
evm = ["wallet", "scaas-rpc/evm", "scaas-rpc/node-client", "dep:alloy", "scaas-ua/fam-evm"]
# T15: the reading layer reads through `scaas-rpc`'s EVM pool and the operations are `wallet`'s; the layout constants of
# `scaas.zether` (`ROOT`, `LAYOUT`) are zether-prover's, the prover `scaas-ua`'s facade runs
zether = ["evm", "scaas-ua/zether", "dep:zether-prover"]
# T16: the PQZ reading layer reads through `scaas-rpc`'s EVM pool and the operations are `wallet`'s, as `zether`
pqz = ["evm", "scaas-ua/pqz"]
pqz-set-n2048-kmax1024 = ["scaas-ua/pqz-set-n2048-kmax1024"]
pqz-set-n2304-kmax4096 = ["scaas-ua/pqz-set-n2304-kmax4096"]
pqz-set-n2560-kmax16384 = ["scaas-ua/pqz-set-n2560-kmax16384"]
pqz-set-n2816-kmax65536 = ["scaas-ua/pqz-set-n2816-kmax65536"]
dex = ["evm"]
admin = ["evm"]
mlock = ["vault", "scaas-ua/mlock"]
# T24.soroban: the ledger keys and entries in base64 (an encoding; the XDR read by fixed templates in the SDK)
# T41.soroban: the operations through `/v1/ops` (`scaas-rpc`'s node client, no alloy) and the self-relay
soroban = ["wallet", "scaas-rpc/soroban", "scaas-rpc/node-client", "dep:base64", "scaas-ua/fam-soroban"]
# T24.solana: the genesis hash, the program, the holder and the mints in base58 (an encoding; the PDA is ua-rs's)
solana = ["scaas-rpc/solana", "dep:bs58", "scaas-ua/fam-solana"]
# T24 (spec §8.7): the family's balance reads; base58 (the genesis hash the endpoint names) and base64 (a view's arguments) are
# encodings, no cryptography
near = ["scaas-rpc/near", "dep:bs58", "dep:base64", "scaas-ua/fam-near"]
# T24: the boxes' names and values and the genesis hash in base64 (an encoding)
algorand = ["scaas-rpc/algorand", "dep:base64", "scaas-ua/fam-algorand"]
aptos = ["scaas-rpc/aptos", "scaas-ua/fam-aptos"]
# T24.sui: chain_uid in base58 (an encoding; the Account<T> id is ua-rs's)
sui = ["scaas-rpc/sui", "dep:bs58", "scaas-ua/fam-sui"]
# T24: a CW20 smart query is base64 JSON in the path (an encoding)
cosmos = ["scaas-rpc/cosmos", "dep:base64", "scaas-ua/fam-cosmos"]
ton = ["scaas-rpc/ton", "scaas-ua/fam-ton"]
# T32's read part (decisions CLI-SDK-32's Change of 2026-11-22): native DOT on Polkadot Hub's Substrate side; the SS58 form
# and the storage key are scaas-ua's; the side is a part of Hub's profile, an EVM one, so it needs `evm`
substrate = ["evm", "scaas-rpc/substrate", "scaas-ua/fam-dot"]
file-store = ["vault"]
# roots (c) and (d) (spec §6.6; T6): scaas-ua's Argon2id roots
classical-roots = ["vault", "scaas-ua/roots"]
opaque-calls = []
# T21 (spec §12; bit 26): the app-core surface for app cores above the SDK
app-core = ["account", "evm", "scaas-ua/app-core"]
# T21 (spec §12.5; bit 27): PqChat's signed records as named entries
pqchat-records = ["app-core"]
# pqchat-core T1 (bit 28): test-only entry points with fixed randomness and key bytes in and out, for the vectors; refused in
# a release build (`compile_error!` without `debug_assertions`), never in a binding (scripts/check_test_features.py, the
# bind-gen check)
vectors = ["app-core", "scaas-ua/vectors"]
# T19: Bitcoin (P2WPKH, P2TR), NEAR and Polkadot native keys (spec §8.5); the raw native entry for an app's own encoder of a
# non-EVM chain (spec §8.6), off by default and never in the default generated surface
native-networks = ["wallet", "scaas-ua/fam-btc", "scaas-ua/fam-near", "scaas-ua/fam-dot"]
raw-native = ["wallet"]
# T41.arweave (chains-arweave plan T20; CLI-SDK-21): Arweave uploads, settlement, re-posts and reads (`src/arweave.rs`), without
# the EVM part; the seal and the open are the app core's (`app-core`); bit 31
# owner 2026-11-23 (T26 B-22): a development build whose profiles may take `Finality::Depth(0)` on any chain; never a release
dev-profiles = []
arweave = ["vault", "scaas-rpc/arweave", "scaas-rpc/node-client", "scaas-ua/fam-arweave"]
# user-profiles plan UP4 (spec 2026-11-27-user-profiles §11; bit 33): many protected local profiles over `ua-rs`'s profile arena
user-profile = ["vault", "file-store", "scaas-ua/user-profile"]
# user-profiles spec §7.5 (bit 34): the test KDF set (8 MiB / 1 / 4) and the test hooks; refused in a release build
# (`compile_error!` without `debug_assertions`), never in a binding (scripts/check_test_features.py, the bind-gen check)
test-hooks = ["user-profile", "scaas-ua/test-hooks"]
# the Dart adapter (src/frb.rs): the platform interfaces as records of async closures; no dependency of its own
frb = []
# T20b-T20h (spec §16.1): the UniFFI surface (src/binding.rs), async (Python, Kotlin, Swift, Java, C# and Go where their
# generator carries async); `sync-api` exports the `*_blocking` twins, cancel tokens and sync platform interfaces instead
# (src/sync_cpp.rs; C++ through uniffi-bindgen-cpp, which refuses any async item)
uniffi = ["dep:uniffi"]
sync-api = ["uniffi"]
# the JS / TS binding (plan T20g, spec §16.4): wasm-bindgen exports of the same list (src/wasm.rs) for wasm32-unknown-unknown;
# records and enums as plain JS objects through serde (most derive it in every build, the rest and the `with` forms under this
# feature)
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen"]

[dependencies]
# default-features = false: scaas-ua's defaults enable `pqz` with one set, so a build asking for another would carry two (§3.2)
scaas-ua = { path = "../ua-rs", default-features = false }
scaas-rpc = { path = "../scaas-rpc", default-features = false }
# feature `zether` (T15): the storage layout of `scaas.zether` only (`state::ROOT`, `state::LAYOUT`); no cryptography is called
zether-prover = { path = "../zether-prover", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
# the keystore label's NFC check (spec §6.1), the pin of scaas-ua
unicode-normalization = "=0.1.26"
zeroize = "=1.9.1"
# ids (seed, account, operation): a UUID v4 from 16 bytes of the OS generator (not a key)
uuid = { version = "1", default-features = false }
getrandom = "0.2"
# T24: the non-EVM families' encodings (the versions in the graph already: bs58 by scaas-ua, base64 by scaas-rpc)
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"], optional = true }
base64 = { version = "0.22", optional = true }
# feature `uniffi` (T20b): the one UniFFI version of every generator (uniffi-bindgen-cpp v0.10.0+v0.31.0, -cs v0.11.1+v0.31.0,
# -go v0.7.1+v0.31.0, -java 0.4.2, the official Python / Kotlin / Swift of 0.31.0)
uniffi = { version = "=0.31.0", optional = true }
# T9: the EVM reads of `account` (the restore scan); T10: the operations of `wallet` (logs, blocks, `U256`); the version and
# features scaas-rpc takes
alloy = { version = "~1.6", default-features = false, features = [
  "std",
  "rpc-types",
  "network",
  "providers",
  "sol-types",
  "dyn-abi",
  "json-abi",
], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
getrandom = { version = "0.2", features = ["js"] }
# the page's event loop (closing review P2-9): tasks by spawn_local, timers by the JS clock; both already in the tree through alloy
wasm-bindgen-futures = "0.4"
wasmtimer = "0.4"
# feature `wasm` (T20g): wasm-bindgen pinned exactly (its CLI must be the same version), the JS types, serde to JS values
wasm-bindgen = { version = "=0.2.130", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }


[dev-dependencies]
# "net", "io-util": tests/account.rs's fake JSON-RPC endpoints on 127.0.0.1:0
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
# the tests' mnemonics of every length (the reference outside the SDK; the pin of scaas-ua)
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc"] }
# the test device's passkey and secure-element keys (plan T13, S1); scaas-ua's pin
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa"] }
# the NEAR fake's view arguments, the Algorand fake's boxes (plan T24)
base64 = "0.22"

# scrypt (N = 2^17) and the ML-KEM / arkworks code crawl unoptimised: the dependencies built at opt-level 3, as ua-rs
[profile.dev.package."*"]
opt-level = 3

