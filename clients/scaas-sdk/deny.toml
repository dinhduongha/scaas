# cargo-deny policy of scaas-sdk (plan T1): scaas-ua's (clients/ua-rs/deny.toml, cargo-deny 0.20.2) as it stands, the gate
# `cargo deny --all-features check` (advisories, bans, licenses, sources). Changes move only with old -> new in the commit.

[graph]
all-features = true

[advisories]
# Every advisory in the RustSec database fails the check, unmaintained and unsound included; an exception needs an
# `ignore` entry with its reason.
version = 2
yanked = "deny"
ignore = [
  # owner 2026-11-05 (plan "Owner answers after T0"): `paste` 1.0.15 is a proc macro of ark-ff 0.5 (unmaintained)
  { id = "RUSTSEC-2024-0436", reason = "build-time only, not in the runtime" },
  # owner 2026-11-05 (ua-rs-sign T3c, option (a)): `crypto-bigint` 0.5.5 (timing variability in constant-time operations)
  # reaches the graph only through ZF `frost-secp256k1` =3.0.0 (k256 0.13.4 -> elliptic-curve 0.13.8 -> crypto-bigint
  # 0.5.5), feature `signers`; that is ZF's latest release. Every other k256 / p256 use is on 0.14 (crypto-bigint 0.7, T3a).
  # Remove this entry when ZF releases on k256 0.14.
  # scaas-sdk T1: `pin-utils` 0.1.1 (unmaintained, archived 2026-10-01; no advisory against its code) reaches the graph only on
  # wasm32, through `wasmtimer` 0.4.3 of alloy 1.6 (scaas-rpc's `evm`). Remove when alloy's timer drops it.
  { id = "RUSTSEC-2026-0441", reason = "wasm32 only, via wasmtimer 0.4.3 of alloy 1.6 (scaas-rpc evm); unmaintained, no vulnerability" },
  { id = "RUSTSEC-2026-0387", reason = "only via ZF frost-secp256k1 =3.0.0 (k256 0.13.4, feature signers), ZF's latest release; remove when ZF releases on k256 0.14 (owner 2026-11-05)" },
]

[licenses]
version = 2
# Permissive licences only, compatible with LicenseRef-Vegan-Community-1.0 (its users get MIT or Apache-2.0 terms). BSD,
# MIT and CC0 notices go into NOTICE.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # scaas-sdk T1: scaas-rpc's TLS stack (reqwest 0.12 rustls): ring 0.17 "Apache-2.0 AND ISC", rustls-webpki and untrusted
  # "ISC" (a permissive MIT-style licence), webpki-roots "CDLA-Permissive-2.0" (the Mozilla root list as data, permissive)
  "ISC",
  "CDLA-Permissive-2.0",

  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

# scaas-sdk T20b: UniFFI (feature `uniffi`, spec §16.1) is MPL-2.0, a file-level copyleft: used unmodified as a dependency, so
# allowed for its own crates only, not for the tree
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_core"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_internal_macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_meta"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_pipeline"

[licenses.private]
# In-repo crates (publish = false: scaas-ua, zether-prover, pqz-*) carry the repository licence.
ignore = true

[bans]
# Duplicate versions are reported (the T0 baseline lists them: two RustCrypto generations side by side); one `aes` and
# one `curve25519-dalek` are required.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ crate = "aes", deny-multiple-versions = true }, { crate = "curve25519-dalek", deny-multiple-versions = true }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
