[package]
name = "scaas_ua_frb"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "flutter_rust_bridge v2 wrapper over scaas-ua. UNAUDITED."

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
scaas-ua = { path = "../../scaas-ua" }

# arkworks subgroup checks crawl unoptimised
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
