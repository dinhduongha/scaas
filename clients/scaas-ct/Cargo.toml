[package]
name = "scaas-ct"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "secret_mul: blinded fixed-width Montgomery ladder for secret scalars on arkworks short-Weierstrass curves (G1, G2). UNAUDITED."

# Owner 2026-11-05 (ua-rs-sign plan, "Owner answers", option (c)): `secret_mul` lives here, shared; `scaas-ua` uses it now,
# `zether-prover` moves onto it in a separate task after the ua-rs-sign round. Pins as scaas-ua's Cargo.lock.
[dependencies]
ark-ec = "0.5"
ark-ff = "0.5"
subtle = { version = "=2.6.1", default-features = false }
zeroize = "=1.8.2"
rand_core = { version = "0.6", features = ["getrandom"] }

# wasm32-unknown-unknown: `rand_core` 0.6's `OsRng` through getrandom 0.2's JS backend (as scaas-ua)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }

[features]
# test-only: a per-thread record of every ladder's blinded integer and iteration count (it holds secrets); never in a release
# build
vectors = []

[dev-dependencies]
ark-bn254 = "0.5"
ark-bls12-381 = "0.5"
rand_chacha = "=0.3.1"

# arkworks crawls unoptimised
[profile.dev.package."*"]
opt-level = 3
