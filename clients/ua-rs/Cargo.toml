[package]
name = "scaas-ua"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "SCaaS Universal Account identity layer: kind table, ids, keyHash, ua_msg, popDigest, UAAuth, key-data validation. UNAUDITED."

[dependencies]
sha3 = "0.10"
# ua-rs-sign T3a (owner 2026-11-05, RUSTSEC-2026-0387): k256 / p256 0.13 -> 0.14 (elliptic-curve 0.14.3, ecdsa 0.17.0,
# crypto-bigint 0.5.5 -> 0.7.10), every use in this crate, verifiers included; bip32 0.5.3 -> 0.6.0 (on k256 0.14). Left on
# crypto-bigint 0.5.5: ZF frost-secp256k1 =3.0.0 (k256 0.13, its latest release), feature `signers` only.
k256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "schnorr", "hash2curve"] }
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa"] }
sha2 = "=0.10.9"
curve25519-dalek = "4"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast"] }
ark-ff = "0.5"
ark-ec = "0.5"
ark-bn254 = "0.5"
ark-bls12-381 = "0.5"
# feature `signers`: BIP-327 MuSig2 (+ the bn254 port) and RFC 9591 FROST with the DKG (ZF frost-core), for groups.json
frost-core = { version = "=3.0.0", default-features = false, optional = true }
frost-secp256k1 = { version = "=3.0.0", default-features = false, optional = true }
rand_core = { version = "0.6", optional = true }
rand_chacha = { version = "=0.3.1", optional = true }
# `secret_mul` (spec §12; owner 2026-11-05, option (c): a shared crate): every secret multiplication on arkworks curves in
# this crate (the pairing kinds' keys and signatures, MuSig2-bn254 nonces, FROST-BN254 through its element newtype)
scaas-ct = { path = "../scaas-ct", optional = true }
# feature `json`: the registry's explicit arguments as JSON string calls (src/json.rs), for ua-c, ua-cxx, ua-qt, ua-dart-frb
serde_json = { version = "=1.0.145", optional = true }
# feature `pq`: the off-chain verifier's PQ kinds (src/pq.rs): the relayer's and the node's only check of what Soroban stores unverified.
# Falcon (ua-rs-sign T3b, MD-8): PQClean vendored in vendor/pqclean-falcon-seeded, built by build.rs (`cc`); pqcrypto-falcon
# =0.4.1 / pqcrypto-traits =0.3.5 (and pqcrypto-internals 0.2.11, getrandom 0.3.4) left the graph (RUSTSEC-2026-0162/-0163/-0165).
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"], optional = true }
slh-dsa = { version = "=0.2.0-rc.5", default-features = false, optional = true }
# feature `wallet` (ua-rs-sign T2): BIP-39, BIP-32, HKDF / HMAC (SLIP-10, EIP-2333, the PQ seeds), zeroize; pins of T0
# (runs/2026-11-05-ua-rs-sign-t0.md)
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc", "zeroize"], optional = true }
bip32 = { version = "=0.6.0", default-features = false, features = ["alloc", "secp256k1"], optional = true }
hkdf = { version = "=0.12.4", optional = true }
hmac = { version = "=0.12.1", optional = true }
zeroize = { version = "=1.8.2", optional = true }
unicode-normalization = { version = "=0.1.26", optional = true }
# ua-rs-sign T3a: the native addresses of clientkeys `describe` (cosmos RIPEMD-160 + bech32, Solana base58, Sui BLAKE2b-256);
# `ripemd` and `bs58` were in the graph already (bip32 0.6), `blake2` is new (RustCrypto, MIT OR Apache-2.0)
ripemd = { version = "=0.2.0", optional = true }
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"], optional = true }
blake2 = { version = "=0.10.6", default-features = false, optional = true }

# wasm32-unknown-unknown: `rand_core` 0.6's `OsRng` through getrandom 0.2's JS backend (T0: features only, no --cfg)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"], optional = true }

[features]
# MD-5 (owner: the facades on by default). `--no-default-features` keeps the verify-only identity layer (+ `pq` / `json` /
# `signers` as before). `zether` (T14) and `pqz` (T15) imply `wallet`; their crates come with those tasks; `pqz-set-*`:
# exactly one with `pqz` (T15 checks it). `vectors`: test-only entry points (secrets through hooks), never in a release build.
default = ["wallet", "zether", "pqz", "pqz-set-n2304-kmax4096"]
wallet = ["pq", "signers", "json", "dep:bip39", "dep:bip32", "dep:hkdf", "dep:hmac", "dep:zeroize", "dep:unicode-normalization",
    "dep:ripemd", "dep:bs58", "dep:blake2", "rand_core/getrandom", "dep:getrandom", "ed25519-dalek/zeroize", "ml-dsa/zeroize", "slh-dsa/zeroize"]
zether = ["wallet"]
pqz = ["wallet"]
pqz-set-n2048-kmax1024 = []
pqz-set-n2304-kmax4096 = []
pqz-set-n2560-kmax16384 = []
pqz-set-n2816-kmax65536 = []
vectors = ["wallet", "scaas-ct/vectors"]
signers = ["dep:frost-core", "dep:frost-secp256k1", "dep:rand_core", "dep:rand_chacha", "dep:scaas-ct"]
json = ["dep:serde_json"]
pq = ["dep:ml-dsa", "dep:slh-dsa", "dep:cc"]

[build-dependencies]
# feature `pq`: the vendored PQClean Falcon (build.rs); any 1.x, so a dependent keeps its own (ua-rs locks 1.10.0)
cc = { version = "1", optional = true }

[dev-dependencies]
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }

[[test]]
name = "groups"
required-features = ["signers"]

[[test]]
name = "json"
required-features = ["json"]

[[test]]
name = "pq"
required-features = ["pq"]

[[test]]
name = "wallet_keys"
required-features = ["wallet"]

[[test]]
name = "wallet_sign"
required-features = ["wallet"]

[[test]]
name = "wallet_pq"
required-features = ["wallet"]

[[test]]
name = "wallet_pairing"
required-features = ["wallet"]

[[test]]
name = "wallet_uasig"
required-features = ["wallet"]

# arkworks subgroup checks crawl unoptimised
[profile.dev.package."*"]
opt-level = 3

[[test]]
name = "wallet_typed"
required-features = ["wallet"]
