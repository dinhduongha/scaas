[package]
name = "scaas-ua"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "SCaaS Universal Account identity layer: kind table, ids, keyHash, ua_msg, popDigest, UAAuth, key-data validation. UNAUDITED."

[dependencies]
sha3 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "schnorr", "hash2curve"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
sha2 = "=0.10.9"
curve25519-dalek = "4"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast"] }
ark-ff = "0.5"
ark-ec = "0.5"
ark-bn254 = "0.5"
ark-bls12-381 = "0.5"
# feature `signers`: BIP-327 MuSig2 (+ the bn254 port) and RFC 9591 FROST with the DKG (ZF frost-core), for groups.json
frost-core = { version = "=3.0.0", default-features = false, optional = true }
frost-secp256k1 = { version = "=3.0.0", default-features = false, optional = true }
rand_core = { version = "0.6", optional = true }
rand_chacha = { version = "=0.3.1", optional = true }
# feature `json`: the registry's explicit arguments as JSON string calls (src/json.rs), for ua-c, ua-cxx, ua-qt, ua-dart-frb
serde_json = { version = "=1.0.145", optional = true }
# feature `pq`: the off-chain verifier's PQ kinds (src/pq.rs): the relayer's and the node's only check of what Soroban stores unverified
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"], optional = true }
slh-dsa = { version = "=0.2.0-rc.5", default-features = false, optional = true }
pqcrypto-falcon = { version = "=0.4.1", default-features = false, optional = true }
pqcrypto-traits = { version = "=0.3.5", default-features = false, optional = true }
# feature `wallet` (ua-rs-sign T2): BIP-39, BIP-32, HKDF / HMAC (SLIP-10, EIP-2333, the PQ seeds), zeroize; pins of T0
# (runs/2026-11-05-ua-rs-sign-t0.md)
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc", "zeroize"], optional = true }
bip32 = { version = "=0.5.3", default-features = false, features = ["alloc", "secp256k1"], optional = true }
hkdf = { version = "=0.12.4", optional = true }
hmac = { version = "=0.12.1", optional = true }
zeroize = { version = "=1.8.2", optional = true }
unicode-normalization = { version = "=0.1.26", optional = true }

# wasm32-unknown-unknown: `rand_core` 0.6's `OsRng` through getrandom 0.2's JS backend (T0: features only, no --cfg)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"], optional = true }

[features]
# MD-5 (owner: the facades on by default). `--no-default-features` keeps the verify-only identity layer (+ `pq` / `json` /
# `signers` as before). `zether` (T14) and `pqz` (T15) imply `wallet`; their crates come with those tasks; `pqz-set-*`:
# exactly one with `pqz` (T15 checks it). `vectors`: test-only entry points (secrets through hooks), never in a release build.
default = ["wallet", "zether", "pqz", "pqz-set-n2304-kmax4096"]
wallet = ["pq", "signers", "json", "dep:bip39", "dep:bip32", "dep:hkdf", "dep:hmac", "dep:zeroize", "dep:unicode-normalization",
    "rand_core/getrandom", "dep:getrandom", "ed25519-dalek/zeroize", "ml-dsa/zeroize", "slh-dsa/zeroize"]
zether = ["wallet"]
pqz = ["wallet"]
pqz-set-n2048-kmax1024 = []
pqz-set-n2304-kmax4096 = []
pqz-set-n2560-kmax16384 = []
pqz-set-n2816-kmax65536 = []
vectors = ["wallet"]
signers = ["dep:frost-core", "dep:frost-secp256k1", "dep:rand_core", "dep:rand_chacha"]
json = ["dep:serde_json"]
pq = ["dep:ml-dsa", "dep:slh-dsa", "dep:pqcrypto-falcon", "dep:pqcrypto-traits"]

[dev-dependencies]
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }

[[test]]
name = "groups"
required-features = ["signers"]

[[test]]
name = "json"
required-features = ["json"]

[[test]]
name = "pq"
required-features = ["pq"]

[[test]]
name = "wallet_keys"
required-features = ["wallet"]

# arkworks subgroup checks crawl unoptimised
[profile.dev.package."*"]
opt-level = 3
