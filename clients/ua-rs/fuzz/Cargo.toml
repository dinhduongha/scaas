[package]
name = "scaas-ua-fuzz"
version = "0.1.0"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

# The oracles of the libFuzzer targets of ua-rs (ua-rs-sign T11; spec §9.3): a staticlib that exports
# LLVMFuzzerTestOneInput itself (the target named by UA_FUZZ_TARGET), linked by build.sh with clang 18's libFuzzer, on
# pqz-core/fuzz's pattern (stable 1.97.1, sancov RUSTFLAGS, no nightly / cargo-fuzz). Feature `vectors` of scaas-ua: the
# bounded reader's parse counter and the backup payload reader (test-only entry points; never a release build).
[lib]
crate-type = ["staticlib"]

[dependencies]
scaas-ua = { path = "..", features = ["vectors"] }
# T14: the zether_cmd oracle reads an accepted command back as JSON (the version in the lock)
serde_json = "=1.0.145"

[profile.release]
debug = 1
# any panic is a finding: caught at LLVMFuzzerTestOneInput and aborted there, which libFuzzer reports as a crash; overflow and
# debug_assert! too (as cargo-fuzz). Unwind, not abort (T15): pqz-ffi refuses panic = "abort" on native targets.
panic = "unwind"
overflow-checks = true
debug-assertions = true

[workspace]
