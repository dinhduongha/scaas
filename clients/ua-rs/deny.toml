# SPDX-License-Identifier: LicenseRef-Vegan-Community-1.0
# cargo-deny policy of scaas-ua (ua-rs-sign T0 baseline, 2026-11-05; tool pinned: cargo-deny 0.20.2). The permanent gate:
# `cargo deny --all-features check` (advisories, bans, licenses, sources). Changes move only with old -> new in the commit.
# The T0 run record: runs/2026-11-05-ua-rs-sign-t0.md.

[graph]
all-features = true

[advisories]
# Every advisory in the RustSec database fails the check, unmaintained and unsound included; an exception needs an
# `ignore` entry with its reason.
version = 2
yanked = "deny"
ignore = [
    # owner 2026-11-05 (plan "Owner answers after T0"): `paste` 1.0.15 is a proc macro of ark-ff 0.5 (unmaintained)
    { id = "RUSTSEC-2024-0436", reason = "build-time only, not in the runtime" },
]

[licenses]
version = 2
# Permissive licences only, compatible with LicenseRef-Vegan-Community-1.0 (its users get MIT or Apache-2.0 terms). BSD,
# MIT and CC0 notices go into NOTICE.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# In-repo crates (publish = false: scaas-ua, zether-prover, pqz-*) carry the repository licence.
ignore = true

[bans]
# Duplicate versions are reported (the T0 baseline lists them: two RustCrypto generations side by side); one `aes` and
# one `curve25519-dalek` are required.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "aes", deny-multiple-versions = true },
    { crate = "curve25519-dalek", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
