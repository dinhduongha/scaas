# cargo-deny policy of scaas-ua (ua-rs-sign T0 baseline, 2026-11-05; tool pinned: cargo-deny 0.20.2). The permanent gate:
# `cargo deny --all-features check` (advisories, bans, licenses, sources). Changes move only with old -> new in the commit.
# The T0 run record: runs/2026-11-05-ua-rs-sign-t0.md.

[graph]
all-features = true

[advisories]
# Every advisory in the RustSec database fails the check, unmaintained and unsound included; an exception needs an
# `ignore` entry with its reason. `unsound = "all"`: cargo-deny's default checks unsound advisories of direct dependencies
# only (node-deps review A-1, 2026-11-28).
version = 2
yanked = "deny"
unsound = "all"
ignore = [
  # owner 2026-11-05 (plan "Owner answers after T0"): `paste` 1.0.15 is a proc macro of ark-ff 0.5 (unmaintained)
  { id = "RUSTSEC-2024-0436", reason = "build-time only, not in the runtime" },
  # owner 2026-11-05 (ua-rs-sign T3c, option (a)) and 2026-11-28 (owner: yes, CLI-UAL-51's Change): `crypto-bigint` 0.5.5
  # (timing variability in constant-time operations: subtraction, zero counting, division and Montgomery multiplication may
  # branch on secrets depending on compiler and CPU) reaches the graph through ZF `frost-secp256k1` =3.0.0 (k256 0.13.4 ->
  # elliptic-curve 0.13.8 -> crypto-bigint 0.5.5), feature `signers`; that is ZF's latest release (2026-04-23, still on
  # k256 ^0.13; checked on crates.io 2026-11-28). Every other k256 / p256 use of scaas-ua is on 0.14 (crypto-bigint 0.7,
  # T3a). The secrets on this path: the user's FROST key share and round-1 nonces (`Wallet::frost_session`,
  # `FrostSession::sign`, clients/ua-rs/src/wallet/pairing.rs) run through the affected operations. Signing is local on the
  # user's device, so an attacker needs precise per-signature timing of it; no crate outside ua-rs calls FROST yet. Dated
  # accept: remove when ZF publishes a frost-secp256k1 release on k256 >= 0.14 and ua-rs moves to it (deps-weekly.yml
  # reports a new release); review by 2027-02-28.
  { id = "RUSTSEC-2026-0387", reason = "only via ZF frost-secp256k1 =3.0.0 (k256 0.13.4, feature signers): the FROST key share and nonces, signed locally; exit a frost-secp256k1 release on k256 >= 0.14 (owner 2026-11-28); review by 2027-02-28" },
]

[licenses]
version = 2
# Permissive licences only, compatible with LicenseRef-Vegan-Community-1.0 (its users get MIT or Apache-2.0 terms). BSD,
# MIT and CC0 notices go into NOTICE.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# In-repo crates (publish = false: scaas-ua, zether-prover, pqz-*) carry the repository licence.
ignore = true

[bans]
# Duplicate versions are reported (the T0 baseline lists them: two RustCrypto generations side by side); one `aes` and
# one `curve25519-dalek` are required.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ crate = "aes", deny-multiple-versions = true }, { crate = "curve25519-dalek", deny-multiple-versions = true }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
