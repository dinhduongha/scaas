# cargo-deny policy of scaas-rpc: scaas-sdk's (scaas-ua's, clients/ua-rs/deny.toml, with the TLS licences and the wasm32
# pin-utils entry; cargo-deny 0.20.2) as it stands, the gate `cargo deny --all-features check` (advisories, bans, licenses,
# sources; step rpc-deny of the gate runner). Changes move only with old -> new in the commit.

[graph]
all-features = true

[advisories]
# Every advisory in the RustSec database fails the check, unmaintained and unsound included; an exception needs an
# `ignore` entry with its reason. `unsound = "all"`: cargo-deny's default checks unsound advisories of direct dependencies
# only (node-deps review A-1, 2026-11-28).
version = 2
yanked = "deny"
unsound = "all"
ignore = [
  # owner 2026-11-05 (plan "Owner answers after T0"): `paste` 1.0.15 is a proc macro of ark-ff 0.5 (unmaintained)
  { id = "RUSTSEC-2024-0436", reason = "build-time only, not in the runtime" },
  # scaas-sdk T1: `pin-utils` 0.1.1 (unmaintained, archived 2026-10-01; no advisory against its code) reaches the graph only on
  # wasm32, through `wasmtimer` 0.4.3 of alloy 1.6 (scaas-rpc's `evm`). Remove when alloy's timer drops it.
  { id = "RUSTSEC-2026-0441", reason = "wasm32 only, via wasmtimer 0.4.3 of alloy 1.6 (scaas-rpc evm); unmaintained, no vulnerability" },
  # crypto-bigint 0.5.5 reaches scaas-rpc's graph only through alloy 1.6 (`evm`: alloy-signer / alloy-primitives -> k256
  # 0.13.4 -> elliptic-curve 0.13.8); every alloy release still requires k256 ^0.13 (checked on crates.io 2026-11-28:
  # alloy 2.6.1 of 2026-11-16, alloy-primitives 1.7.3), so alloy 2 is no exit. The crate signs nothing (only
  # tests/anvil.rs signs, with anvil's public dev key), so no secret is on this path here; its users' own keys are theirs to
  # judge (scaas-sdk's and the node's entries). Remove when alloy moves to k256 0.14 (node-deps review B-3, 2026-11-28).
  { id = "RUSTSEC-2026-0387", reason = "only via alloy 1.6 (k256 0.13.4); scaas-rpc signs nothing; remove when alloy moves to k256 0.14; review by 2027-02-28" },
  # lru 0.16.4 (unsound: `LruCache::pop` may use freed memory when a key's Drop panics and the panic is caught) via
  # alloy-provider 1.6.3 (scaas-rpc's `evm`), whose caches key on u64 block numbers and B256 hashes: no key Drop can panic.
  # Fixed in lru 0.18.2, which alloy-provider requires from 2.4.0 (2026-08-12; 2.0-2.3 still take lru ^0.16; checked on
  # crates.io 2026-11-28, latest 2.6.1): remove with the move to alloy-provider >= 2.4 (alloy 2, its own round).
  { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 via alloy-provider 1.6.3, u64 / B256 keys whose Drop cannot panic; fix needs alloy-provider >= 2.4 (alloy 2); review by 2027-02-28" },
]

[licenses]
version = 2
# Permissive licences only, compatible with LicenseRef-Vegan-Community-1.0 (its users get MIT or Apache-2.0 terms). BSD,
# MIT and CC0 notices go into NOTICE.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # scaas-sdk T1: scaas-rpc's TLS stack (reqwest 0.12 rustls): ring 0.17 "Apache-2.0 AND ISC", rustls-webpki and untrusted
  # "ISC" (a permissive MIT-style licence), webpki-roots "CDLA-Permissive-2.0" (the Mozilla root list as data, permissive)
  "ISC",
  "CDLA-Permissive-2.0",

  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# In-repo crates (publish = false: scaas-ua, zether-prover, pqz-*) carry the repository licence.
ignore = true

[bans]
# Duplicate versions are reported (the T0 baseline lists them: two RustCrypto generations side by side); one `aes` and
# one `curve25519-dalek` are required.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ crate = "aes", deny-multiple-versions = true }, { crate = "curve25519-dalek", deny-multiple-versions = true }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
