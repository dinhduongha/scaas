# SPDX-License-Identifier: LicenseRef-Vegan-Community-1.0
# pqchat-core plan T12: the bindings check's reference library, a sibling of the SDK's (clients/scaas-sdk/ffi, which stays
# SDK-only): `pqchat-core` linked with the SDK's FRB surface rules, its glue generated by the SDK's generator
# (flutter_rust_bridge_codegen 2.13.0) at check time only (runs/2026-11-17-pqchat-core-bind.sh; never committed). An app
# links its own one library instead. UNAUDITED.
[package]
name = "pqchat-core-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
license-file = "../../../LICENSE"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
pqchat-core = { path = ".." }
scaas-sdk = { path = "../../scaas-sdk", default-features = false, features = ["frb", "app-core", "pqchat-records"] }
flutter_rust_bridge = "=2.13.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.dev.package."*"]
opt-level = 3
