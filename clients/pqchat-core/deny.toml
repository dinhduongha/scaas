# cargo-deny policy of pqchat-core (plan T2): scaas-sdk's (clients/scaas-sdk/deny.toml) as it stands, the gate `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every advisory in the RustSec database fails the check, unmaintained and unsound included; an exception needs an
# `ignore` entry with its reason. `unsound = "all"`: cargo-deny's default checks unsound advisories of direct dependencies
# only (node-deps review A-1, 2026-11-28).
version = 2
yanked = "deny"
unsound = "all"
ignore = [
  # owner 2026-11-05 (plan "Owner answers after T0"): `paste` 1.0.15 is a proc macro of ark-ff 0.5 (unmaintained)
  { id = "RUSTSEC-2024-0436", reason = "build-time only, not in the runtime" },
  # owner 2026-11-05 (ua-rs-sign T3c, option (a)) and 2026-11-28 (owner: yes, CLI-UAL-51's Change): `crypto-bigint` 0.5.5
  # (timing variability in constant-time operations: subtraction, zero counting, division and Montgomery multiplication may
  # branch on secrets depending on compiler and CPU) reaches the graph through ZF `frost-secp256k1` =3.0.0 (k256 0.13.4 ->
  # elliptic-curve 0.13.8 -> crypto-bigint 0.5.5), feature `signers`; that is ZF's latest release (2026-04-23, still on
  # k256 ^0.13; checked on crates.io 2026-11-28). Every other k256 / p256 use of scaas-ua is on 0.14 (crypto-bigint 0.7,
  # T3a). The secrets on this path: the user's FROST key share and round-1 nonces (`Wallet::frost_session`,
  # `FrostSession::sign`, clients/ua-rs/src/wallet/pairing.rs) run through the affected operations. Signing is local on the
  # user's device, so an attacker needs precise per-signature timing of it; no crate outside ua-rs calls FROST yet. Dated
  # accept: remove when ZF publishes a frost-secp256k1 release on k256 >= 0.14 and ua-rs moves to it (deps-weekly.yml
  # reports a new release); review by 2027-02-28.
  # scaas-sdk T1: `pin-utils` 0.1.1 (unmaintained, archived 2026-10-01; no advisory against its code) reaches the graph only on
  # wasm32, through `wasmtimer` 0.4.3 of alloy 1.6 (scaas-rpc's `evm`). Remove when alloy's timer drops it.
  { id = "RUSTSEC-2026-0441", reason = "wasm32 only, via wasmtimer 0.4.3 of alloy 1.6 (scaas-rpc evm); unmaintained, no vulnerability" },
  # node-deps review 2026-11-28: crypto-bigint 0.5.5 also reaches the graph through alloy 1.6 (scaas-rpc's `evm`:
  # alloy-signer / alloy-primitives -> k256 0.13.4); every alloy release still requires k256 ^0.13
  # (checked on crates.io 2026-11-28: alloy 2.6.1 of 2026-11-16, alloy-primitives 1.7.3), so alloy 2 is no exit.
  { id = "RUSTSEC-2026-0387", reason = "via ZF frost-secp256k1 =3.0.0 (feature signers: the FROST key share and nonces, signed locally; owner 2026-11-28) and alloy 1.6 (k256 0.13.4); exit a frost-secp256k1 release on k256 >= 0.14 and alloy on k256 >= 0.14; review by 2027-02-28" },
  # lru 0.16.4 (unsound: `LruCache::pop` may use freed memory when a key's Drop panics and the panic is caught) via
  # alloy-provider 1.6.3 (scaas-rpc's `evm`), whose caches key on u64 block numbers and B256 hashes: no key Drop can panic.
  # Fixed in lru 0.18.2, which alloy-provider requires from 2.4.0 (2026-08-12; 2.0-2.3 still take lru ^0.16; checked on
  # crates.io 2026-11-28, latest 2.6.1): remove with the move to alloy-provider >= 2.4 (alloy 2, its own round).
  { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 via alloy-provider 1.6.3, u64 / B256 keys whose Drop cannot panic; fix needs alloy-provider >= 2.4 (alloy 2); review by 2027-02-28" },
]

[licenses]
version = 2
# Permissive licences only, compatible with LicenseRef-Vegan-Community-1.0 (its users get MIT or Apache-2.0 terms). BSD,
# MIT and CC0 notices go into NOTICE.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # scaas-sdk T1: scaas-rpc's TLS stack (reqwest 0.12 rustls): ring 0.17 "Apache-2.0 AND ISC", rustls-webpki and untrusted
  # "ISC" (a permissive MIT-style licence), webpki-roots "CDLA-Permissive-2.0" (the Mozilla root list as data, permissive)
  "ISC",
  "CDLA-Permissive-2.0",

  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# In-repo crates (publish = false: scaas-ua, zether-prover, pqz-*) carry the repository licence.
ignore = true

[bans]
# Duplicate versions are reported (the T0 baseline lists them: two RustCrypto generations side by side); one `aes` and
# one `curve25519-dalek` are required.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ crate = "aes", deny-multiple-versions = true }, { crate = "curve25519-dalek", deny-multiple-versions = true }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
