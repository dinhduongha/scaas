[package]
name = "pqchat-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
license-file = "../../LICENSE"
description = "PqChat's client core above scaas-sdk (CLI-PQC-01): sessions, epochs, checks, order, recovery, topics. No cryptography of its own. UNAUDITED."

# docs/clients/pqchat-core.md (CLI-PQC-*), spec docs/superpowers/specs/2026-11-17-pqchat-core.md. CLI-PQC-01: the SDK with its
# app-core surface and PqChat's record entries, and nothing else that touches a key, a node or Matrix (tests/deps.rs).
[dependencies]
# default-features = false: no file store or mlock of the SDK's own (the app's build chooses them); the wasm32 check builds it
scaas-sdk = { path = "../scaas-sdk", default-features = false, features = ["app-core", "pqchat-records"] }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
# content values and the crate's own store items only, never written as signed bytes
serde_json = "1"
# the device id: a UUID v4 from 16 bytes of the OS generator (not a key), as the SDK makes its ids
uuid = { version = "1", default-features = false }
getrandom = "0.2"
tracing = "0.1"
# the transport trait's and the chain port's async methods as trait objects (in the SDK's graph already)
async-trait = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tracing-core = "0.1"

# the SDK's: the dependencies built at opt-level 3 (scrypt and ML-KEM crawl unoptimised)
[profile.dev.package."*"]
opt-level = 3
