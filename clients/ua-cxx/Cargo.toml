[package]
name = "scaas-ua-cxx"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "C++ (cxx) bridge over scaas-ua. UNAUDITED."
# ua-rs-sign T13b: also an rlib, so ua-qt links this bridge (its C++ side is ua-cxx); `links` exports the generated headers
# (DEP_SCAAS_UA_CXX_CXXBRIDGE_DIR*) to that build
links = "scaas-ua-cxx"

[lib]
crate-type = ["staticlib", "rlib"]

# ua-rs-sign T13a: the wallet (spec §9.1) and both facades at the default PQZ set (MD-5, as ua-c's default), `mlock` on native
# builds; never `vectors` (src/wallet.rs refuses it at compile time)
[dependencies]
scaas-ua = { path = "../ua-rs", default-features = false, features = ["json", "wallet", "mlock", "zether", "pqz", "pqz-set-n2304-kmax4096"] }
cxx = "=1.0.202"
zeroize = "=1.8.2"

# every call runs in catch_unwind (src/lib.rs `guard`): keep unwinding (pqz-ffi refuses panic = "abort")
[profile.release]
panic = "unwind"

# as ua-rs: scrypt, the PQ signers, the arkworks subgroup checks and the PQZ prover crawl unoptimised
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
cxx-build = "=1.0.202"
